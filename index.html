<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>반가사유: 사유의 소리 (Humartology Edition)</title>
    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Pretendard', sans-serif; overflow: hidden; touch-action: manipulation; }
        #game-container { 
            position: relative; width: 100vw; height: 100vh; 
            background: url('반가-로뎅.png') no-repeat center center; 
            background-size: contain;
            transition: all 5s ease-in-out;
        }
        #shape-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

      .hotspot { 
    position: absolute; 
    cursor: pointer; 
    z-index: 10; 
    -webkit-tap-highlight-color: rgba(212, 175, 55, 0.3); /* 터치 시 반투명 황금색 피드백 */
}

        .hotspot:hover { background: rgba(255, 215, 0, 0.1); }

.btn-group {
    position: absolute; 
    top: calc(env(safe-area-inset-top, 0px) + 65px); /* 타이틀과의 간격 확보 */
    left: 50%; 
    transform: translateX(-50%);
    display: flex; 
    gap: 10px; 
    z-index: 90;
    width: 95%; 
    justify-content: center;
}
        .action-btn {
            padding: 12px 25px; background: rgba(212, 175, 55, 0.9); color: black;
            border: 2px solid white; border-radius: 30px; font-weight: bold; 
            cursor: pointer; font-size: 1rem; transition: 0.3s;
        }
        .action-btn:hover { background: white; border-color: gold; }
        #intro-btn { background: rgba(255, 255, 255, 0.2); color: white; }
        #intro-btn:hover { background: white; color: black; }

/* 타이틀 스타일: 가장 위에 보이도록 z-index 조정 */
#main-title {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 15px); /* 상단 여백 */
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    text-align: center;
    z-index: 100; /* 버튼보다 높은 우선순위 */
    margin: 0;
    font-size: 1.6rem;
    color: gold;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    font-weight: bold;
    pointer-events: none; /* 타이틀이 버튼 클릭을 방해하지 않도록 설정 */
}


        #subtitle-overlay {
            position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%);
            width: 75%; text-align: center; pointer-events: none; z-index: 20;
        }
        .subtitle-text {
            background: rgba(0, 0, 0, 0.85); color: gold; padding: 25px 35px;
            border-radius: 15px; font-size: 1.4rem; line-height: 1.7;
            display: none; border: 2px solid gold; animation: slideUp 0.4s;
            word-break: keep-all; box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            pointer-events: auto;
            cursor: pointer;
        }
        
        /* 거울 모드 가이드 */
        #mirror-guide {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; display: none; z-index: 25; pointer-events: none;
        }
        .guide-circle {
            width: 200px; height: 200px; border: 5px dashed gold; border-radius: 50%;
            margin: 0 auto 20px; animation: pulse 2s infinite;
        }

        /* YES 버튼 스타일 */
        .confirm-btn {
            margin-top: 15px; padding: 10px 30px; background: gold; color: black;
            border: none; border-radius: 20px; font-weight: bold; cursor: pointer;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 0.5; } }
    </style>
</head>
<body>
<h1 id="main-title">반가사유: 사유의 소리 </h1>

<div class="btn-group">
    <button id="intro-btn" class="action-btn" onclick="playIntroduction()">전시 소개 보기</button>
    <button id="guide-btn" class="action-btn" onclick="playGuide()">사용법 보기</button>
    <button id="mode-btn" class="action-btn" onclick="toggleMode()">1단계: 조우</button>
</div>

<div id="game-container">
    
<div id="mirror-guide">
    <svg width="150" height="150" viewBox="0 0 150 150" style="display: block; margin: 0 auto;">
        <circle cx="75" cy="75" r="60" stroke="rgba(212, 175, 55, 0.3)" stroke-width="8" fill="none" stroke-dasharray="10,5" />
        <circle id="gauge-progress" cx="75" cy="75" r="60" stroke="gold" stroke-width="8" fill="none" 
                stroke-dasharray="376.99" stroke-dashoffset="376.99" 
                stroke-linecap="round" style="transition: stroke-dashoffset 0.8s ease; transform: rotate(-90deg); transform-origin: center;" />
    </svg>
    <div id="mirror-text">체화 단계를 시작합니다</div>
</div>

    <svg id="shape-svg"></svg>
    <div id="subtitle-overlay"><div id="sub-box" class="subtitle-text"></div></div>

<div id="rodin-head" class="hotspot" style="top: 18%; left: 15%; width: 25%; height: 18%;"></div>
<div id="rodin-torso" class="hotspot" style="top: 36%; left: 10%; width: 30%; height: 25%;"></div>
<div id="maitreya-head" class="hotspot" style="top: 15%; right: 13%; width: 25%; height: 20%;"></div>
<div id="maitreya-torso" class="hotspot" style="top: 35%; right: 10%; width: 35%; height: 28%;"></div>
<div id="maitreya-legs" class="hotspot" style="top: 60%; right: 10%; width: 40%; height: 25%;"></div>

</div>

<script>
    const svg = document.getElementById('shape-svg');
    const subBox = document.getElementById('sub-box');
    const container = document.getElementById('game-container');
    const mirrorGuide = document.getElementById('mirror-guide');
    let audioCtx;

function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

    let currentMode = 1; 
    let dialogueIndex = 0;
    let selectedScript = null;
    let mirrorCheck = { rodin_head: false, rodin_torso: false, head: false, torso: false, legs: false }; 
    let currentAudioFile = null;
    let onSubtitleNext = null;
    let stage3Timeout = null; 
    let currentPartInStage3 = null;

    function stopAllPlayback() {
        window.speechSynthesis.cancel();
        if (currentAudioFile) { currentAudioFile.pause(); currentAudioFile.currentTime = 0; currentAudioFile = null; }
        if (stage3Timeout) { clearTimeout(stage3Timeout); stage3Timeout = null; }
        subBox.style.display = 'none';
    }

    const introData = [
        { title: "공(空)의 공명: 로댕의 생각하는 사람과 반가사유상", text: "본 전시는 서양의 '존재적 고뇌'와 동양의 '자비로운 사유'가 만나는 지점을 다룹니다." },
        { title: "작가 소개: 조준동 (Jun Dong Cho)", text: "성균관대학교 명예교수이자 휴마톨로지(Humartology)의 주창자로, 기술에 인간의 감성과 예술적 가치를 녹여내는 연구를 이어오고 있습니다. Copyright © 2026 조준동(Jun Dong Cho). All Rights Reserved." },
        { title: "철학: 물아일체(物我 일체)", text: "예술을 보는 것이 아니라, 감상자의 신체를 인터페이스 삼아 그 시대의 정신과 직접 접속하는 '체화된 인지'를 지향합니다." }
    ];

    const rodinFirstScript = [
        { speaker: 'rodin_head', name: '로댕', text: "당신은 어찌하여 그토록 평온한 미소를 짓고 있습니까? 내 머릿속은 존재의 고통으로 터질 것만 같은데.", color: '#ff4500' },
        { speaker: 'maitreya_head', name: '반가사유상', text: "나 역시 그대처럼 깊은 고뇌 속에 있었소. 하지만 비움으로써 비로소 채워지는 진리를 보았지.", color: 'gold' },
        { speaker: 'rodin_head', name: '로댕', text: "비운다는 것... 그것은 나처럼 육체를 쥐어짜는 고통보다 더 어려운 일인 것 같군요.", color: '#ff4500' },
        { speaker: 'maitreya_head', name: '반가사유상', text: "고통을 쥐는 손을 놓아보시오. 그러면 그대 안의 무한한 허공이 보일 것이오.", color: 'gold' }
    ];

    const maitreyaFirstScript = [
        { speaker: 'maitreya_head', name: '반가사유상', text: "먼 곳에서 온 나그네여, 무엇이 그대의 어깨를 그토록 무겁게 짓누르고 있소?", color: 'gold' },
        { speaker: 'rodin_head', name: '로댕', text: "생각의 사슬입니다. 인간의 삶과 죽음, 그 끝없는 모순을 형상화하려니 숨이 가빠오는군요.", color: '#ff4500' },
        { speaker: 'maitreya_head', name: '반가사유상', text: "모순 또한 삶의 결이라오. 팽팽한 긴장을 풀고 잠시 내면의 소리에 귀를 기울여 보시오.", color: 'gold' },
        { speaker: 'rodin_head', name: '로댕', text: "나의 정 끝에 서린 날카로움이 당신의 자비로운 선율 앞에 무뎌지는 기분이 듭니다.", color: '#ff4500' }
    ];

    function handleSubtitleAction(e) {
        if (e && e.target.tagName === 'BUTTON') return; 
        if (e) e.preventDefault();

        if (currentMode === 3 && currentPartInStage3) {
            const part = currentPartInStage3;
            currentPartInStage3 = null;
            if (stage3Timeout) { clearTimeout(stage3Timeout); stage3Timeout = null; }
            window.speechSynthesis.cancel();
            
            subBox.innerHTML = `<span style='color:white; font-weight:bold; font-size:1.6rem;'>따라했나요?</span><br><button class='confirm-btn' onclick='confirmStage3Part("${part}")'>YES</button>`;
            speak("따라했나요?");
            return;
        }

        if (onSubtitleNext) {
            const next = onSubtitleNext;
            onSubtitleNext = null;
            stopAllPlayback();
            next();
        } else {
            subBox.style.display = 'none';
            stopAllPlayback();
        }
    }

    subBox.addEventListener('click', handleSubtitleAction);

    function playIntroduction() {
initAudio();
        stopAllPlayback();
        let i = 0;
        function nextIntro() {
            if (i < introData.length) {
                const item = introData[i];
                showSubtitle(`<b>${item.title}</b><br>${item.text}`, "white", () => { i++; nextIntro(); });
                speak(`${item.title}. ${item.text}`);
            }
        }
        nextIntro();
    }

    function playGuide() {
initAudio();
        stopAllPlayback();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const guideText = "이 전시는 네 단계로 구성됩니다. 첫번째 단계(조우)에서는 조각의 부위를 터치하여 철학적 사유를 감상하세요. 두번째 단계(공명)에서는 두 조각이 서로 대화를 나눕니다. 세번째 단계(체화)에서는 먼저 로댕의 생각하는 사람의 고뇌하는 자세를 따라한 뒤, 반가사유상의 자세와 자비로운 미소를 체화해 봅니다. 마지막 단계(승화)에서는 고뇌가 평온으로 승화되는 물아일체의 순간을 경험합니다.";
        showSubtitle(`<b>전시 관람 가이드</b><br>${guideText}`, "white");
        speak(guideText);
    }

    function toggleMode() {
initAudio();
        stopAllPlayback();
        currentPartInStage3 = null;

if (currentMode === 5 || document.getElementById('mode-btn').innerText === "다시 시작") {
        location.reload(); 
        return;
    }

        if (currentMode === 0) {
        currentMode = 1;
        startStage1();
       } else if (currentMode === 1) {
            currentMode = 2;
            document.getElementById('mode-btn').innerText = "단계 2: 공명의 대화";
        } else if (currentMode === 2) {
            currentMode = 3; 
            startStage3RodinSequence();
            document.getElementById('mode-btn').innerText = "단계 3: 체화";
            document.getElementById('mode-btn').disabled = true;
        } else if (currentMode === 4) { 
            startStageFinal();
        } else {
            location.reload();
        }
        dialogueIndex = 0;
        selectedScript = null;
        svg.innerHTML = '';
    }

    function startStage3RodinSequence() {
        mirrorGuide.style.display = 'block';
    //    document.getElementById('mirror-text').innerText = "로댕의 생각하는 사람의 부위부터 따라 하세요";
        handleStage3Interaction('rodin_head');
    }

    function handleStage3Interaction(part) {
        stopAllPlayback();
        currentPartInStage3 = part;
        
        const content = {
            rodin_head: { text: "로댕의 '생각하는 사람'의 얼굴 표정을 보세요. 깊은 고뇌에 빠져 미간을 찌푸린 채 입술을 굳게 다물고 있습니다. 이제 그 표정을 따라해 보세요.", color: "#ff4500", label: "로댕의 생각하는 사람의 고뇌" },
            rodin_torso: { text: "이번에는 생각하는 사람의 웅크린 자세입니다. 온몸의 근육을 수축시키고 몸을 웅크려 존재의 무게를 견디는 강렬한 긴장을 몸으로 느껴보세요. 이제 따라해 보세요.", color: "#ff4500", label: "생각하는 사람의 긴장" },
            head: { text: "입가에 잔잔한 미소를 지으며 오른쪽 손가락 끝을 뺨에 살짝 대보세요. 비움으로써 채워지는 자비의 미소입니다. 이제 따라해 보세요.", color: "gold", label: "반가사유 미소" },
            torso: { text: "가슴을 펴고 당당하면서도 유연하게 상체의 긴장을 풀어보세요. 인간의 마음을 따뜻하게 감싸는 조화의 공간입니다. 이제 따라해 보세요.", color: "gold", label: "반가사유 가슴" },
            legs: { text: "오른쪽 다리를 왼쪽 무릎 위에 올리세요. 불균형 속의 균형, '중용'을 몸으로 경험합니다. 이제 따라해 보세요.", color: "gold", label: "반가사유 반가" }
        };

        const item = content[part];
        if (!item) return;

        if (part === 'head' || part === 'torso' || part === 'legs') {
            if (!mirrorCheck.rodin_head || !mirrorCheck.rodin_torso) {
                currentPartInStage3 = null;
                showSubtitle(`<b>안내</b><br>먼저 생각하는 사람의 두 부위를 모두 따라 하셔야 합니다.`, "white");
                speak("먼저 생각하는 사람의 두 부위를 모두 따라 하셔야 합니다.");
                return;
            }
        }

        showSubtitle(`<b>[체화: ${item.label}]</b><br>${item.text}`, item.color);
        speak(item.text);

        stage3Timeout = setTimeout(() => {
            currentPartInStage3 = null;
            subBox.innerHTML = `<span style='color:white; font-weight:bold; font-size:1.6rem;'>따라했나요?</span><br><button class='confirm-btn' onclick='confirmStage3Part("${part}")'>YES</button>`;
            speak("따라했나요?");
        }, 11000); 
    }

    window.confirmStage3Part = function(part) {
        mirrorCheck[part] = true;
updateCentralGauge(); // [수정] YES 클릭 시 실시간으로 게이지 업데이트
        stopAllPlayback();
        currentPartInStage3 = null;
        
        if (mirrorCheck.rodin_head && mirrorCheck.rodin_torso && mirrorCheck.head && mirrorCheck.torso && mirrorCheck.legs) {
            currentMode = 4;
            const finalQuestion = "모든 자세를 체화하셨습니다. 생각하는 사람의 고뇌가 반가사유상의 미소를 통해 마음의 평화로 승화되었음을 느끼셨나요?";
            showSubtitle(`<b>3단계 미션 완료</b><br>${finalQuestion}`, "white");
            speak(finalQuestion);
            
            setTimeout(() => {
                document.getElementById('mode-btn').innerText = "4단계: 여일(餘一) 시작";
                document.getElementById('mode-btn').disabled = false;
                mirrorGuide.style.display = 'none';
            }, 6000);
        } else {
            document.getElementById('mirror-text').innerText = "다음 부위를 선택하여 따라하세요";
        }
    };

    function handleInteraction(id, e) {
initAudio();
        const key = id.replace(/-/g, '_');
        
        if (currentMode === 3) {
            const partKey = key.startsWith('maitreya') ? key.split('_')[1] : key;
            handleStage3Interaction(partKey);
            return;
        }

        if (currentMode === 4) return;

        stopAllPlayback();
        if (currentMode === 1) executeStage1(key);
        else if (currentMode === 2) handleDialogue(key);
    }

    function executeStage1(key) {
        const item = stage1Data[key];
        if(!item) return;
        item.draw();
        showSubtitle(`<b>[사유]</b><br>${item.philosophy}`, key.includes('rodin') ? '#ff4500' : 'gold');
        speak(item.philosophy);
    }

    function handleDialogue(key) {
        if (key !== 'rodin_head' && key !== 'maitreya_head') return;
        if (selectedScript === null) {
            if (key === 'rodin_head') selectedScript = rodinFirstScript;
            else if (key === 'maitreya_head') selectedScript = maitreyaFirstScript;
        }
        const line = selectedScript[dialogueIndex];
        if (key === line.speaker) {
            if (line.speaker === 'rodin_head') drawCircle(26, 30, 45, line.color);
            else drawCircle(77, 28, 55, line.color);
            
            showSubtitle(`<b>${line.name}</b><br>${line.text}`, line.color, () => {
                handleDialogue(line.speaker === 'rodin_head' ? 'maitreya-head' : 'rodin-head');
            });
            speak(line.text);
            dialogueIndex = (dialogueIndex + 1) % selectedScript.length;
        }
    }

function startStageFinal() {
        mirrorGuide.style.display = 'none';

    const modeBtn = document.getElementById('mode-btn');
    modeBtn.innerText = "다시 시작"; // 버튼 텍스트 변경
    modeBtn.disabled = false;      // 버튼 활성화

   //     document.getElementById('mode-btn').innerText = "다시 시작";
        
        const msg = "생각하는 사람의 치열한 사유(긴장)가 반가사유상의 자비로운 미소(이완)로 승화되었습니다. 이제 자세를 3분간 유지하며 몸에서 일어나는 변화를 관찰하십시오. 마지막으로 지금 느낀 '몸의 감각'을 한 단어로 마음속에 새겨보십시오. 당신과 유물의 경계가 사라진 '여일'의 순간입니다.";
        
        // 자막 표시
        showSubtitle(`<b>여일(餘一): 고뇌에서 해탈로</b><br>${msg}`, "white");
        
        // 음성 안내 설정
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(msg);
        u.lang = 'ko-KR';
        u.rate = 0.9;
   // 음성이 끝난 후 오디오 재생 로직
    u.onend = function() {
        playEchoesAudio();
    };

    window.speechSynthesis.speak(u);

    // [참고] 만약 설명창을 클릭하면 즉시 음악으로 넘어가게 하고 싶다면
    onSubtitleNext = () => {
        window.speechSynthesis.cancel();
        playEchoesAudio();
    };

    // 배경 명상음 (Oscillator) 생성
    playMeditationSound();

    currentMode = 5; 
}


// 오디오 오버레이 및 재생 함수 분리
function playEchoesAudio() {
    const oldOverlay = document.getElementById('audio-overlay');
    if (oldOverlay) oldOverlay.remove();

    const audioOverlay = document.createElement('div');
    audioOverlay.id = 'audio-overlay';
    audioOverlay.style.position = 'fixed';

// [추가] 게이지 실선 업데이트 함수
function updateCentralGauge() {
    const gauge = document.getElementById('gauge-progress');
    if (!gauge) return;
    const totalParts = 5;
    const completedCount = Object.values(mirrorCheck).filter(v => v === true).length;
    
    // 반지름 60 기준 둘레: 2 * Math.PI * 60 = 약 376.99
    const circumference = 2 * Math.PI * 60; 
    const offset = circumference - (completedCount / totalParts) * circumference;
    
    gauge.style.strokeDashoffset = offset;
}
