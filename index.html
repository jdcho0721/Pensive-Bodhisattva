<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>침묵의 공명: 고뇌와 자비의 조우 (Humartology Edition)</title>
    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Pretendard', sans-serif; overflow: hidden; touch-action: manipulation; }
        #game-container { 
            position: relative; width: 100vw; height: 100vh; 
            background: url('반가-로댕.png') no-repeat center center; 
            background-size: contain;
            transition: all 5s ease-in-out;
        }

        /* ── 작품 소개·사용법 오버레이 ── */
        .info-page-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.95); z-index: 300; display: none;
            justify-content: center; align-items: center; box-sizing: border-box;
            padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px) 20px;
        }
        .info-page-content {
            background: rgba(15,15,15,0.98); border: 1px solid rgba(212,175,55,0.5);
            border-radius: 20px; width: 90%; max-width: 660px; max-height: 82vh;
            overflow-y: auto; padding: 32px 28px;
            box-shadow: 0 0 40px rgba(212,175,55,0.25); animation: slideUp 0.35s ease-out;
            text-align: left; box-sizing: border-box;
            scrollbar-width: thin; scrollbar-color: gold rgba(0,0,0,0.3);
        }
        .info-page-content::-webkit-scrollbar { width: 6px; }
        .info-page-content::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); border-radius: 10px; }
        .info-page-content::-webkit-scrollbar-thumb { background-color: gold; border-radius: 10px; }
        .info-page-title { font-size: 1.6rem; color: gold; margin: 0 0 18px 0; text-align: center; font-weight: bold; border-bottom: 1px solid rgba(212,175,55,0.3); padding-bottom: 12px; letter-spacing: 0.05em; }
        .info-page-body { font-size: 1rem; line-height: 1.85; color: #ddd; word-break: keep-all; }
        .info-page-body h3 { color: #e8c84a; margin: 20px 0 8px 0; font-size: 1.1rem; letter-spacing: 0.03em; }
        .info-page-body p { margin: 0 0 12px 0; color: #ccc; }
        .info-page-body ul { margin: 0 0 14px 0; padding-left: 18px; color: #ccc; }
        .info-page-body li { margin-bottom: 7px; }
        .close-info-btn {
            display: block; width: 100%; margin-top: 24px; padding: 13px 0;
            background: gold; color: #000; border: none; border-radius: 12px;
            font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.25s;
        }
        .close-info-btn:hover { background: #fff; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

        /* ── 작품 소개·사용법 헤더 버튼 ── */
        .info-open-btn {
            background: rgba(0,0,0,0.6); border: 1px solid rgba(212,175,55,0.4);
            color: #d4af37; padding: 8px 14px; border-radius: 20px;
            font-size: 0.8rem; font-weight: 600; backdrop-filter: blur(8px);
            cursor: pointer; transition: all 0.3s ease;
        }
        .info-open-btn:active { background: #d4af37; color: #000; }

        /* ── 챗봇 ── */
        #chatbot-container {
            position: absolute; bottom: 50px; right: 20px;
            width: 275px; height: 320px; z-index: 100;
            display: none; /* 3단계 이후에만 표시 */
            flex-direction: column;
            background: rgba(0,0,0,0.92); border: 2px solid gold;
            border-radius: 15px; overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
        }
        @media (max-width: 1100px) {
            #chatbot-container { right: auto !important; left: 12px !important; bottom: 90px !important; }
        }
        @media (max-width: 600px) {
            #chatbot-container { width: calc(100% - 24px) !important; left: 12px !important; bottom: 100px !important; height: 340px !important; }
        }
        #chat-messages { flex: 1; overflow-y: auto; padding: 10px; color: white; font-size: 0.88rem; line-height: 1.45; scrollbar-width: thin; scrollbar-color: gold rgba(0,0,0,0.3); }
        #chat-messages::-webkit-scrollbar { width: 4px; }
        #chat-messages::-webkit-scrollbar-thumb { background-color: gold; border-radius: 4px; }

        /* ── 4단계 마무리: 빈 공간 + 원 회전 ── */
        #finale-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 500; display: none;
            justify-content: center; align-items: center; flex-direction: column;
            opacity: 0; transition: opacity 2.5s ease-in-out;
        }
        #finale-overlay.visible { opacity: 1; }
        #finale-canvas { display: block; }
        #finale-text {
            position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%);
            text-align: center; color: rgba(212,175,55,0.85);
            font-size: clamp(0.9rem, 2.5vw, 1.25rem);
            letter-spacing: 0.12em; line-height: 2;
            opacity: 0; transition: opacity 3s ease-in-out 1.5s;
            pointer-events: none; white-space: nowrap;
        }
        #finale-text.visible { opacity: 1; }
        #finale-restart {
            position: absolute; bottom: 6%; left: 50%; transform: translateX(-50%);
            background: transparent; border: 1px solid rgba(212,175,55,0.5);
            color: rgba(212,175,55,0.7); padding: 10px 28px; border-radius: 25px;
            font-size: 0.9rem; cursor: pointer; letter-spacing: 0.08em;
            opacity: 0; transition: opacity 2s ease-in-out 5s, border-color 0.3s, color 0.3s;
        }
        #finale-restart.visible { opacity: 1; }
        #finale-restart:hover { border-color: gold; color: gold; }
        #shape-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        .hotspot { position: absolute; cursor: pointer; z-index: 10; -webkit-tap-highlight-color: rgba(212, 175, 55, 0.3); }
        .hotspot:hover { background: none; }
        
        /* 핫스팟 정밀 배율 조정 좌표 */
        #rodin-head { top: 15%; left: 16%; width: 14%; height: 14%; border-radius: 50%; }
        #rodin-torso { top: 30%; left: 10%; width: 25%; height: 25%; border-radius: 40%; }
        #rodin-legs { top: 56%; left: 8%; width: 26%; height: 30%; border-radius: 30%; }
        #maitreya-head { top: 11%; left: 69%; width: 14%; height: 14%; border-radius: 50%; }
        #maitreya-torso { top: 26%; left: 64%; width: 24%; height: 26%; border-radius: 40%; }
        #maitreya-legs { top: 53%; left: 62%; width: 28%; height: 33%; border-radius: 30%; }

        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; display: flex; flex-direction: column; justify-content: space-between; padding: calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom)) 20px; box-sizing: border-box; }
        #header-group { display: flex; justify-content: space-between; align-items: flex-start; pointer-events: auto; }
        .header-btn { background: rgba(0,0,0,0.6); border: 1px solid rgba(212,175,55,0.4); color: #d4af37; padding: 10px 18px; border-radius: 25px; font-size: 0.9rem; font-weight: 600; backdrop-filter: blur(8px); cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4); transition: all 0.3s ease; -webkit-transform: translate3d(0,0,0); }
        .header-btn:active { background: #d4af37; color: #000; }
        #main-title { font-size: 1.3rem; font-weight: 700; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.8); letter-spacing: -0.5px; background: rgba(0,0,0,0.4); padding: 8px 16px; border-radius: 15px; backdrop-filter: blur(4px); }
        
        #ai-scenario-group, #stage3-scenario-group { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; pointer-events: auto; flex-wrap: wrap; }
        .scenario-btn { background: rgba(20,20,20,0.85); border: 1px solid #444; color: #aaa; padding: 10px 16px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .scenario-btn.active { background: #d4af37; color: #000; border-color: #d4af37; font-weight: bold; box-shadow: 0 0 15px rgba(212,175,55,0.4); }
        
        #subtitle-box { background: rgba(10, 10, 10, 0.88); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 24px; padding: 22px 28px; min-height: 70px; display: none; pointer-events: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.7); backdrop-filter: blur(15px); text-align: left; transition: all 0.3s ease; max-width: 650px; margin: 0 auto; width: 90%; box-sizing: border-box; }
        #subtitle-box b { font-size: 1.15rem; display: block; margin-bottom: 6px; letter-spacing: -0.3px; }
        #subtitle-box p { margin: 0; font-size: 1.02rem; line-height: 1.6; color: #ddd; word-break: keep-all; }

        #mirror-guide-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; display: none; }
        .mirror-box { position: absolute; border: 2px dashed rgba(255,255,255,0.25); background: rgba(255,255,255,0.03); border-radius: 15px; display: flex; justify-content: center; align-items: center; color: rgba(255,255,255,0.4); font-size: 0.85rem; font-weight: 500; transition: all 0.5s ease-in-out; box-sizing: border-box; }
        .mirror-box.active { border-color: #d4af37; background: rgba(212,175,55,0.08); color: #d4af37; font-weight: bold; box-shadow: inset 0 0 20px rgba(212,175,55,0.15); }
        
        .confirm-btn { background: #d4af37; color: #000; border: none; padding: 12px 28px; border-radius: 25px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 15px; box-shadow: 0 5px 15px rgba(212,175,55,0.4); transition: transform 0.2s; }
        .confirm-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

<!-- ══════════════════════════════════════════════════
     사운드 트랙 매핑
     rodin-head    : The_Silent_Weight_of_Stone  (돌의 침묵 — 고뇌하는 머리)
     rodin-torso   : The_Weight_of_Bronze        (청동의 무게 — 뒤틀린 몸통)
     rodin-legs    : Bearing_the_Bedrock         (대지를 짊어짐 — 발)
     maitreya-head : 손끝에_맺힌_온기            (손가락이 뺨에 닿는 온기)
     maitreya-torso: Where_Bamboo_Bends          (대나무의 유연함 — 상체)
     maitreya-legs : Beneath_the_Temple_Floor    (사원 바닥의 고요 — 하체)
     stage-2 공명  : Echoes_of_the_Void          (공(空)의 메아리 — 두 조각상 대화)
     finale        : Sacred_Morning              (신성한 아침 — 4단계 명상)
     ══════════════════════════════════════════════════ -->
<audio id="snd-rodin-head"     src="The_Silent_Weight_of_Stone.mp4" preload="auto"></audio>
<audio id="snd-rodin-torso"    src="The_Weight_of_Bronze.mp4"       preload="auto"></audio>
<audio id="snd-rodin-legs"     src="Bearing_the_Bedrock.mp4"        preload="auto"></audio>
<audio id="snd-maitreya-head"  src="손끝에_맺힌_온기.mp4"            preload="auto"></audio>
<audio id="snd-maitreya-torso" src="Where_Bamboo_Bends.mp4"         preload="auto"></audio>
<audio id="snd-maitreya-legs"  src="Beneath_the_Temple_Floor.mp4"   preload="auto"></audio>
<audio id="snd-void"           src="Echoes_of_the_Void.mp4"         preload="auto" loop></audio>
<audio id="snd-finale"         src="Sacred_Morning.mp4"             preload="auto" loop></audio>

<!-- ── 작품 소개 / 사용법 오버레이 ── -->
<div id="info-overlay" class="info-page-overlay" onclick="closeInfoOverlay(event)">
    <div class="info-page-content" onclick="event.stopPropagation()">
        <h2 id="info-overlay-title" class="info-page-title"></h2>
        <div id="info-overlay-body" class="info-page-body"></div>
        <button class="close-info-btn" onclick="closeInfoOverlay(null)">닫기</button>
    </div>
</div>

<!-- ── 챗봇: 사유의 상담소 (3단계 이후 표시) ── -->
<div id="chatbot-container">
    <div style="background:gold;color:black;padding:10px 14px;font-weight:bold;text-align:center;display:flex;justify-content:space-between;align-items:center;font-size:0.92rem;">
        <span>🤍 사유의 상담소</span>
        <button onclick="document.getElementById('chatbot-container').style.display='none'" style="background:none;border:none;color:black;font-weight:bold;cursor:pointer;font-size:1.1rem;">✕</button>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px;background:rgba(20,20,20,0.95);border-bottom:1px solid rgba(212,175,55,0.25);">
        <button onclick="setChatCategory('전체')" style="padding:3px 8px;background:rgba(212,175,55,0.15);color:gold;border:1px solid rgba(212,175,55,0.5);border-radius:10px;font-size:0.72rem;cursor:pointer;">전체</button>
        <button onclick="setChatCategory('작품론')" style="padding:3px 8px;background:rgba(212,175,55,0.15);color:gold;border:1px solid rgba(212,175,55,0.5);border-radius:10px;font-size:0.72rem;cursor:pointer;">작품론</button>
        <button onclick="setChatCategory('비교철학')" style="padding:3px 8px;background:rgba(212,175,55,0.15);color:gold;border:1px solid rgba(212,175,55,0.5);border-radius:10px;font-size:0.72rem;cursor:pointer;">비교철학</button>
        <button onclick="setChatCategory('예술기법')" style="padding:3px 8px;background:rgba(212,175,55,0.15);color:gold;border:1px solid rgba(212,175,55,0.5);border-radius:10px;font-size:0.72rem;cursor:pointer;">예술기법</button>
        <button onclick="setChatCategory('사유명상')" style="padding:3px 8px;background:rgba(212,175,55,0.15);color:gold;border:1px solid rgba(212,175,55,0.5);border-radius:10px;font-size:0.72rem;cursor:pointer;">사유명상</button>
    </div>
    <div id="chat-messages" style="flex:1;overflow-y:auto;padding:10px;color:white;font-size:0.88rem;line-height:1.45;">
        <div style="margin-bottom:8px;color:gold;">조각상: 당신의 깊은 고민이나 궁금증을 물어보세요. 사유의 길을 함께 찾겠습니다.</div>
    </div>
    <div style="padding:8px;display:flex;gap:5px;background:rgba(255,255,255,0.07);border-top:1px solid rgba(212,175,55,0.4);">
        <input type="text" id="chat-input" style="flex:1;border-radius:6px;border:none;padding:8px 10px;outline:none;font-size:0.85rem;background:#111;color:#fff;" placeholder="질문을 입력하세요..." onkeydown="if(event.key==='Enter')handleChat()">
        <button onclick="handleChat()" style="background:gold;border:none;padding:6px 14px;border-radius:6px;font-weight:bold;cursor:pointer;">전송</button>
    </div>
</div>

<!-- ── 4단계 마무리 오버레이: fade out 후 빈 공간에서 원 회전 ── -->
<div id="finale-overlay">
    <canvas id="finale-canvas"></canvas>
    <div id="finale-text">침묵 속에서<br>당신은 이미 완전합니다<br>無</div>
    <button id="finale-restart" onclick="resetGame()">처음으로 돌아가기</button>
</div>

<div id="game-container">
    <svg id="shape-svg"></svg>
    <div id="mirror-guide-container"></div>

    <div class="hotspot" id="rodin-head"></div>
    <div class="hotspot" id="rodin-torso"></div>
    <div class="hotspot" id="rodin-legs"></div>
    <div class="hotspot" id="maitreya-head"></div>
    <div class="hotspot" id="maitreya-torso"></div>
    <div class="hotspot" id="maitreya-legs"></div>

    <div id="ui-layer">
        <div id="header-group">
            <button class="info-open-btn" onclick="openInfoOverlay('intro')">작품 소개</button>
            <div id="main-title"></div>
            <div style="display:flex;gap:8px;align-items:center;">
                <button class="info-open-btn" onclick="openInfoOverlay('guide')">사용법</button>
                <button class="header-btn" id="reset-btn" onclick="resetGame()">다시 조우하기</button>
                <button class="header-btn" id="mode-btn" onclick="toggleMode()">단계 1: 조우</button>
            </div>
        </div>

        <div id="interaction-flow-group" style="width: 100%; pointer-events: none;">
            <div id="ai-scenario-group" style="display: none;">
                <button class="scenario-btn" onclick="selectScenario(1)">시나리오 1: 생성과 소멸</button>
                <button class="scenario-btn" onclick="selectScenario(2)">시나리오 2: 실존과 초월</button>
                <button class="scenario-btn" onclick="selectScenario(3)">시나리오 3: 문명과 침묵</button>
            </div>
            <div id="stage3-scenario-group" style="display: none;">
                <button class="scenario-btn" id="s3-btn-1" onclick="selectStage3Part('head')">머리 사유</button>
                <button class="scenario-btn" id="s3-btn-2" onclick="selectStage3Part('torso')">상체 비움</button>
                <button class="scenario-btn" id="s3-btn-3" onclick="selectStage3Part('legs')">하체 안착</button>
            </div>
            <div id="subtitle-box"></div>
        </div>
    </div>
</div>

<script>
    // --- [1] 핵심 웹 오디오 통합 코어 시스템 ---
    let audioCtx = null;
    let masterGain = null;
    let currentOsc = null;
    let backgroundDrone = null;
    let drumInterval = null;

    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        masterGain.connect(audioCtx.destination);
        // startDrone 제거 — 저주파 "웅" 소리 원인
    }

    function startDrone() { /* 드론 비활성화 */ }

    function playResonanceSound(freq, type, duration) {
        if (!audioCtx) initAudio();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gainNode);
        gainNode.connect(masterGain);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function triggerBell() { playResonanceSound(523.25, 'sine', 3.5); } // 맑은 사찰의 명상종 소리
    function triggerDrum() { playResonanceSound(80, 'triangle', 0.8); } // 깊은 심연의 북소리

    function stopAllPlayback() {
        if (currentOsc) { try { currentOsc.stop(); } catch(e){} currentOsc = null; }
        if (drumInterval) { clearInterval(drumInterval); drumInterval = null; }
        window.speechSynthesis.cancel();
        _stopMp4All();
    }

    // ── MP4 사운드트랙 제어 ──────────────────────────────
    const _mp4Ids = [
        'snd-rodin-head','snd-rodin-torso','snd-rodin-legs',
        'snd-maitreya-head','snd-maitreya-torso','snd-maitreya-legs',
        'snd-void','snd-finale'
    ];
    let _mp4FadeTimer = null;

    function _stopMp4All() {
        if (_mp4FadeTimer) { clearTimeout(_mp4FadeTimer); _mp4FadeTimer = null; }
        _mp4Ids.forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            el.pause();
            el.currentTime = 0;
            el.volume = 1;
        });
    }

    // vol: 최종 음량(0~1), autostop: 몇 초 후 페이드아웃 (0=비활성)
    function _playMp4(id, vol, autostopSec) {
        _stopMp4All();
        const el = document.getElementById(id);
        if (!el) return;
        el.volume = 0;
        el.currentTime = 0;
        el.play().catch(() => {});
        // 페이드인 (0.6초)
        let v = 0;
        const step = vol / 12;
        const fi = setInterval(() => {
            v = Math.min(v + step, vol);
            el.volume = v;
            if (v >= vol) clearInterval(fi);
        }, 50);
        // 자동 페이드아웃
        if (autostopSec > 0) {
            _mp4FadeTimer = setTimeout(() => _fadeOutMp4(el), autostopSec * 1000);
        }
    }

    function _fadeOutMp4(el) {
        if (!el || el.paused) return;
        const fo = setInterval(() => {
            el.volume = Math.max(el.volume - 0.05, 0);
            if (el.volume <= 0) { clearInterval(fo); el.pause(); el.currentTime = 0; }
        }, 80);
    }

    // ── 해설 중 MP4 볼륨 덕킹 + 오실레이터 자동 정지 ──
    // 해설 시작 시 MP4를 낮추고(duck), 해설 종료 후 원래 볼륨으로 복원
    // 복원 뒤 osc(오실레이터)도 함께 정지해 "웅" 소리 제거
    function _duckForSpeech(text, mp4El, fullVol, osc) {
        const DUCK_VOL = 0.05; // 해설 중 배경음 볼륨

        // 볼륨 덕킹
        if (mp4El && !mp4El.paused) {
            mp4El.volume = DUCK_VOL;
        }

        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ko-KR';
        msg.onend = () => {
            // 해설 종료: 볼륨 복원
            if (mp4El && !mp4El.paused) {
                let v = DUCK_VOL;
                const restore = setInterval(() => {
                    v = Math.min(v + 0.04, fullVol);
                    mp4El.volume = v;
                    if (v >= fullVol) clearInterval(restore);
                }, 60);
            }
            // 오실레이터 정지 — "웅" 소리 차단
            if (osc) { try { osc.stop(); } catch(e){} }
            if (drumInterval) { clearInterval(drumInterval); drumInterval = null; }
        };
        window.speechSynthesis.speak(msg);
    }

    function handleInteraction(id) {

        if (!selectedScenarioId) {
            showSubtitle('<b>시나리오를 먼저 선택해 주세요</b><p>위의 시나리오 1·2·3 중 하나를 선택하면 각 부위의 철학적 사유가 해당 주제로 안내됩니다.</p>', '#d4af37');
            speak("위의 시나리오 버튼을 먼저 선택해 주세요.");
            return;
        }

        stopAllPlayback();

        const scenarioData = stage1ScenarioData[selectedScenarioId];
        const data = scenarioData ? scenarioData[id] : null;
        const sound = soundMap[id];
        if (!data || !sound) return;

        mainTitle.innerText = data.title;
        showSubtitle(`<b>${data.title}</b><p>${data.text}</p>`, "white");

        // ── 부위별 MP4 사운드트랙 재생 (15초 후 자동 페이드아웃) ──
        _playMp4('snd-' + id, id.includes('rodin') ? 0.25 : 0.2, 15);

        const isRodin = id.includes('rodin');
        if (isRodin) {
            triggerDrum();
            drumInterval = setInterval(triggerDrum, 1200);
        } else {
            triggerBell();
        }

        currentOsc = audioCtx.createOscillator();
        const bGain = audioCtx.createGain();
        currentOsc.type = sound.soundType;
        currentOsc.frequency.setValueAtTime(sound.freq, audioCtx.currentTime);
        bGain.gain.setValueAtTime(isRodin ? 0.12 : 0.25, audioCtx.currentTime);
        currentOsc.connect(bGain);
        bGain.connect(masterGain);
        currentOsc.start();

        // ── 해설 중 MP4 볼륨 덕킹: 낮추고 → 해설 끝나면 복원 후 오실레이터 정지 ──
        const mp4El = document.getElementById('snd-' + id);
        const fullVol = id.includes('rodin') ? 0.25 : 0.2;
        _duckForSpeech(data.text, mp4El, fullVol, currentOsc);
    }

        // 현재 시나리오의 정밀 프롬프트 명세 적용
        const spec = scenarioPrompts[selectedScenarioId] || scenarioPrompts[1];
        const persona = isRodin ? spec.rodinPersona : spec.maitreyaPersona;
        const keywords = isRodin ? spec.rodinKeywords : spec.maitreyaKeywords;

        const prompt = `
당신은 명작 조각 [${roleName}]의 예술적 영혼입니다.

[이번 대화의 주제]: ${spec.title}

[당신의 페르소나]:
${persona}

[이번 발화에서 담아야 할 핵심 키워드 (자연스럽게 녹여낼 것)]:
${keywords}

${JSON.stringify(dialogueSessionData)}

위 지침을 바탕으로, 이전 대화 기록을 자연스럽게 이어받아 당신의 페르소나와 철학을 담은 고풍스럽고 품격 있는 한국어 딱 '한 문장'으로 답하시오.
이미 사용된 표현이나 단어는 반드시 피하고, 새로운 관점의 문장을 생성하시오.
        `;

        try {
            showSubtitle(`<b>${roleName} 사유 중...</b>`, targetColor);
            const textResult = await fetchAITalk(prompt);
            
            dialogueSessionData.push({ name: roleName, text: textResult });
            showSubtitle(`<b>${roleName}의 공명</b><br>${textResult}`, targetColor);

            speakSpatial(textResult, speaker, () => {
                if (depth < 4) {
                    setTimeout(() => {
                        triggerScenarioNode(isRodin ? 'maitreya' : 'rodin', context, depth + 1);
                    }, 1000);
                } else {
                    finishStage2();
                }
            });
        } catch(e) {
            console.error(e);
            finishStage2();
        }
    }

            svg.innerHTML = `<circle cx="${cx}" cy="${cy}" r="${radius}" stroke="${isRodin ? '#ff4500':'gold'}" stroke-width="3" fill="none" opacity="${1 - radius/150}"/>`;

        }, 20);
    }

    async function executeStage3AIRelay(speakerKey, userTroubleText) {
        if (!userTroubleText) return;

        // 프롬프트 엔지니어링 완벽 구현
        const basePersona = isRodin

        const promptTemplate = `

            [당신의 기본 페르소나]:
            ${basePersona}
            
            [감상자가 토로한 삶의 고민]:
            "${userTroubleText}"
            
            [정밀 맥락 분석 및 수행 지침]:
            1. 감상자가 토로한 고민의 깊이와 언어에 담긴 연륜, 상황적 무게를 정밀하게 읽어내십시오.
            2. ${isRodin 
                ? '감상자의 고뇌에 깊이 공감하며, 삶의 무게와 실존적 번뇌를 함께 아파하는 무겁고 격조 높은 철학적 문장으로 조언하십시오.' 
                : '번뇌를 부드럽게 씻어주고 마음을 비워내게 유도하는 반가사유상 특유의 자비롭고 안온한 미소가 담긴 한 문장 위로를 하십시오.'}
            3. 이전 조각상의 대화 기록이 아래에 있다면, 그 흐름을 단절하지 말고 깊이 있게 이어받는 '릴레이 공명 방식'을 취하십시오.
            
            [현재까지 진행된 릴레이 대화 기록]:
            ${JSON.stringify(stage3DialogueSessionData)}
            
            위 지침을 엄격히 준수하여, 감상자의 가슴을 관통할 수 있도록 격조 높고 정제된 품격 있는 고풍스러운 한국어 딱 '한 문장'으로 최종 답변을 작성하십시오.
        `;

        try {
            showSubtitle(`<b>${role} 사유 중...</b>`, color);
            if (isRodin) { triggerDrum(); drawPulseEffect(true); } else { triggerBell(); drawPulseEffect(false); }
            
            // 공용 인공지능 서버 통신
            const aiResponse = await fetchAITalk(promptTemplate);
            
            // 로그 저장용 데이터 축적
            stage3DialogueSessionData.push({ name: role, speaker: speakerKey, text: aiResponse });
            
            // 입체 자막 표출
            showSubtitle(`<b>${role}의 공명</b><br>${aiResponse}`, color);
            
            // 입체 오디오(Spatial Pan) 제어 및 완료 후 콜백 제어
            speakSpatial(aiResponse, speakerKey, () => {
                // [순서 제어 로직 핵심]: 첫 번째 발화(로댕)가 끝나면 스피치 API 완료 콜백을 통해 자동으로 반가사유상으로 바통을 넘김
                if (speakerKey === 'rodin') {

                        else { modeBtn.innerText = "다시 시작"; currentMode = 4; startStageFinal(); }
                    };
                    subBox.appendChild(finishBtn);
                }
            });

        } catch (error) {
            console.error("3단계 AI 릴레이 통신 오류:", error);
            showSubtitle("사유의 통로가 잠시 혼잡합니다. 잠시 후 다시 공명 버튼을 눌러주십시오.", "red");
            isStage3AIConversation = false;
        }
    }

// [핵심 함수] AI 통신 로직 (제공해주신 로컬 서버용 로직)
async function fetchAITalk(prompt) {
    try {
        const response = await fetch("http://localhost:1234/v1/chat/completions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "qwen2.5-1.5b-instruct", 
                messages: [
                    { 
                        role: "system", 
                        content: "로댕의 생각하는 사람은 실존적 고뇌와 고통을, 반가사유상은 자비와 비움, 해탈을 상징합니다. 마주 보고 있는 상대방에게 건넬 짧은 철학적 대화 한 문장을 생성해줘." 
                    },
                    { role: "user", content: prompt }
                ],
                temperature: 0.7,
                max_tokens: 100
            })
        });
        const data = await response.json();
        return data.choices[0].message.content;
    } catch (error) {
        console.error("AI 연결 오류:", error);
        return "침묵 속에서 답을 찾고 있습니다. (서버 연결을 확인해주세요)";
    }
}

    function downloadLogFile(data) {
        if (data.length === 0) return;
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'text/plain' });

        const a = document.createElement('a');
        a.href = url; a.download = 'ao.out'; a.click();
    }

    // ═══════════════════════════════════════════════════
    // ── 4단계: fade out → 빈 공간 원 회전 마무리 ──
    // ═══════════════════════════════════════════════════
    function triggerFinaleSequence() {
        const overlay = document.getElementById('finale-overlay');
        const canvas  = document.getElementById('finale-canvas');
        const text    = document.getElementById('finale-text');
        const restart = document.getElementById('finale-restart');

        // canvas size
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;

        overlay.style.display = 'flex';

        // 배경(game-container) fade out
        const gc = document.getElementById('game-container');
        gc.style.transition = 'opacity 2.5s ease-in-out';
        gc.style.opacity = '0';

        setTimeout(() => {
            overlay.classList.add('visible');
            text.classList.add('visible');
            restart.classList.add('visible');
            startFinaleCanvas(canvas);
        }, 400);
    }

    function startFinaleCanvas(canvas) {
        const ctx = canvas.getContext('2d');
        const cx = canvas.width  / 2;
        const cy = canvas.height / 2;
        let angle = 0;
        let frame = 0;
        const circles = [
            { r: 90,  speed: 0.008, lineW: 1.2, alpha: 0.55 },
            { r: 145, speed: 0.005, lineW: 1.0, alpha: 0.38 },
            { r: 210, speed: 0.003, lineW: 0.7, alpha: 0.22 },
            { r: 290, speed: 0.002, lineW: 0.5, alpha: 0.14 }
        ];

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            circles.forEach((c, i) => {
                const a = angle * c.speed * 300 + i * Math.PI / 4;

                // 원 경계선
                ctx.beginPath();
                ctx.arc(cx, cy, c.r, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(212,175,55,${c.alpha})`;
                ctx.lineWidth = c.lineW;
                ctx.stroke();

                // 작은 빛 점 (회전)
                const dotX = cx + c.r * Math.cos(a);
                const dotY = cy + c.r * Math.sin(a);
                const grad = ctx.createRadialGradient(dotX, dotY, 0, dotX, dotY, 8);
                grad.addColorStop(0, `rgba(255,220,100,${c.alpha * 1.8})`);
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.beginPath();
                ctx.arc(dotX, dotY, 8, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                // 반대편 점
                const dotX2 = cx + c.r * Math.cos(a + Math.PI);
                const dotY2 = cy + c.r * Math.sin(a + Math.PI);
                const grad2 = ctx.createRadialGradient(dotX2, dotY2, 0, dotX2, dotY2, 5);
                grad2.addColorStop(0, `rgba(200,160,60,${c.alpha})`);
                grad2.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.beginPath();
                ctx.arc(dotX2, dotY2, 5, 0, Math.PI * 2);
                ctx.fillStyle = grad2;
                ctx.fill();
            });

            // 중심 글자 (無)
            const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 60);
            glow.addColorStop(0, 'rgba(212,175,55,0.18)');
            glow.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.beginPath();
            ctx.arc(cx, cy, 60, 0, Math.PI * 2);
            ctx.fillStyle = glow;
            ctx.fill();

            ctx.font = `${Math.max(32, canvas.width * 0.06)}px serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = `rgba(212,175,55,${0.5 + 0.2 * Math.sin(frame * 0.018)})`;
            ctx.fillText('無', cx, cy);

            angle += 1;
            frame++;
            requestAnimationFrame(draw);
        }

        draw();
    }
</script>
