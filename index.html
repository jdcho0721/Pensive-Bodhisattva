<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>반가사유: 사유의 소리 (Humartology Edition)</title>
    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Pretendard', sans-serif; overflow: hidden; touch-action: manipulation; }
        #game-container { 
            position: relative; width: 100vw; height: 100vh; 
            background: url('반가-로뎅.png') no-repeat center center; 
            background-size: contain;
            transition: all 5s ease-in-out;
        }
        #shape-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        .hotspot { position: absolute; cursor: pointer; z-index: 10; -webkit-tap-highlight-color: rgba(212, 175, 55, 0.3); }
        .hotspot:hover { background: rgba(255, 215, 0, 0.05); }
        
        .btn-group {
            position: absolute; 
            top: calc(env(safe-area-inset-top, 0px) + 75px); 
            left: 50%; 
            transform: translateX(-50%);
            display: flex; 
            gap: 8px; 
            z-index: 90;
            justify-content: center;
        }
        .action-btn {
            padding: 8px 18px; background: rgba(212, 175, 55, 0.9); color: black;
            border: 2px solid white; border-radius: 22px; font-weight: bold; 
            cursor: pointer; font-size: 1rem; transition: 0.3s; white-space: nowrap;
        }
        .action-btn:hover { background: white; border-color: gold; }
        
        .label-btn-group {
            position: absolute;
            bottom: 5%;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 0 5%;
            box-sizing: border-box;
            z-index: 95;
        }
        .label-btn {
            padding: 10px 24px;
            background: rgba(30, 30, 30, 0.85);
            color: white;
            border: 2px solid #fff;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #btn-label-rodin { font-size: 1.1rem; border-color: #ff4500; color: #ff4500; }
        #btn-label-rodin:hover { background: #ff4500; color: white; }
        #btn-label-maitreya { border-color: gold; color: gold; }
        #btn-label-maitreya:hover { background: gold; color: black; }

        #main-title {
            position: absolute; top: calc(env(safe-area-inset-top, 0px) + 15px); 
            left: 50%; transform: translateX(-50%); width: 100%; text-align: center;
            z-index: 100; margin: 0; font-size: 2.1rem; color: gold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8); font-weight: bold; pointer-events: none; 
        }
        #subtitle-overlay {
            position: absolute; bottom: 18%; left: 50%; transform: translateX(-50%);
            width: 75%; text-align: center; pointer-events: none; z-index: 20;
        }
        .subtitle-text {
            background: rgba(0, 0, 0, 0.85); color: gold; padding: 25px 35px;
            border-radius: 15px; font-size: 1.4rem; line-height: 1.7;
            display: none; border: 2px solid gold; animation: slideUp 0.4s;
            word-break: keep-all; box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            pointer-events: auto; cursor: pointer;
        }
        
        #mirror-guide {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; display: none; z-index: 25; pointer-events: none;
        }
        .confirm-btn {
            margin-top: 15px; padding: 12px 35px; background: gold; color: black;
            border: 2px solid white; border-radius: 25px; font-weight: bold; cursor: pointer;
            font-size: 1.1rem; transition: 0.2s; box-shadow: 0 0 10px rgba(255,215,0,0.5);
        }
        .confirm-btn:hover { background: white; color: black; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .purifying { filter: brightness(3) grayscale(1) blur(10px); opacity: 0.7; }
        .total-silence { background: white !important; filter: none !important; }

        /* 새로 추가된 한 페이지 보기(모달) 스타일 */
        .info-page-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.95); z-index: 200; display: none;
            justify-content: center; align-items: center; box-sizing: border-box;
            padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px) 20px;
        }
        .info-page-content {
            background: rgba(20, 20, 20, 0.9); border: 2px solid gold; border-radius: 20px;
            width: 90%; max-width: 650px; max-height: 80vh; overflow-y: auto;
            padding: 30px; box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
            animation: slideUp 0.3s ease-out; text-align: left; box-sizing: border-box;
        }
        .info-page-title { font-size: 1.8rem; color: gold; margin-top: 0; margin-bottom: 20px; text-align: center; font-weight: bold; border-bottom: 1px solid rgba(212,175,55,0.3); padding-bottom: 10px; }
        .info-page-body { font-size: 1.1rem; line-height: 1.8; color: #fff; word-break: keep-all; }
        .info-page-body h3 { color: gold; margin-top: 20px; margin-bottom: 8px; font-size: 1.25rem; }
        .info-page-body p { margin: 0 0 12px 0; color: #e0e0e0; }
        .info-page-body ul { margin: 0 0 15px 0; padding-left: 20px; color: #e0e0e0; }
        .info-page-body li { margin-bottom: 6px; }
        .close-page-btn {
            display: block; width: 100%; margin-top: 25px; padding: 12px 0;
            background: gold; color: black; border: none; border-radius: 12px;
            font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center;
        }
        .close-page-btn:hover { background: white; }
    </style>
</head>
<body>
<h1 id="main-title">반가사유: 사유의 소리 (1단계: 조우)</h1>

<div class="btn-group">
    <button class="action-btn" onclick="openInfoPage('intro')" onmouseenter="speakButtonIn('작품 소개 버튼입니다.')">작품 소개</button>
    <button class="action-btn" onclick="openInfoPage('guide')" onmouseenter="speakButtonIn('관람 가이드 버튼입니다.')">관람 가이드</button>
    <button id="mode-btn" class="action-btn" onclick="toggleMode()" onmouseenter="speakDynamicModeButton()">다음 단계: 공명의 시간</button>
</div>

<div id="ai-scenario-group" class="btn-group" style="top: calc(env(safe-area-inset-top, 0px) + 130px); display: none; flex-wrap: wrap; width: 95%; justify-content: center; z-index: 100;">
    <button class="action-btn" onclick="startStage2('script')" style="font-size: 0.85rem; background: #6c757d; color: white; margin: 5px;" onmouseenter="speakButtonIn('조각상의 고정 대본 대화 버튼입니다.')">1) 조각상의 고정 대본 대화</button>
    <button class="action-btn" onclick="startStage2('ai_sim')" style="font-size: 0.85rem; background: #4a90e2; color: white; margin: 5px;" onmouseenter="speakButtonIn('조각상의 인공지능 상호 사유 대화 버튼입니다.')">2) 조각상의 AI 상호 사유 대화</button>
    <button class="action-btn" onclick="startStage2('ai_personal')" style="font-size: 0.85rem; background: #ff4500; color: white; margin: 5px;" onmouseenter="speakButtonIn('인공지능 조각상과의 대화 버튼입니다.')">3) AI 조각상과의 대화 </button>
</div>

<div id="label-btn-container" class="label-btn-group">
    <button id="btn-label-rodin" class="label-btn" onclick="playLabelDescription('rodin')" onmouseenter="speakButtonIn('생각하는 사람 작품 정보 버튼입니다.')">생각하는 사람</button>
    <button id="btn-label-maitreya" class="label-btn" onclick="playLabelDescription('maitreya')" onmouseenter="speakButtonIn('반가사유상 작품 정보 버튼입니다.')">반가사유상</button>
</div>

<div id="info-page-overlay" class="info-page-overlay" onclick="closeInfoPage(event)">
    <div class="info-page-content" onclick="event.stopPropagation()">
        <h2 id="info-page-title" class="info-page-title">제목</h2>
        <div id="info-page-body" class="info-page-body">내용</div>
        <button class="close-page-btn" onclick="closeInfoPage(null)">닫기</button>
    </div>
</div>

<div id="game-container">
    <div id="mirror-guide">
        <div id="mirror-text" style="color: gold; font-weight: bold; margin-bottom: 10px;">체화 단계를 시작합니다</div>
        <svg width="150" height="150" viewBox="0 0 150 150" style="display: block; margin: 0 auto;">
            <circle cx="75" cy="75" r="60" stroke="rgba(212, 175, 55, 0.3)" stroke-width="6" fill="none" stroke-dasharray="10,5" />
            <circle id="gauge-progress" cx="75" cy="75" r="60" stroke="gold" stroke-width="6" fill="none" 
                    stroke-dasharray="376.99" stroke-dashoffset="376.99" 
                    stroke-linecap="round" style="transition: stroke-dashoffset 0.8s ease; transform: rotate(-90deg); transform-origin: center;" />
        </svg>
    </div>

    <svg id="shape-svg"></svg>
    <div id="subtitle-overlay"><div id="sub-box" class="subtitle-text"></div></div>

    <div id="rodin-head" class="hotspot" style="top: 15%; left: 10%; width: 25%; height: 20%;"></div>
    <div id="rodin-torso" class="hotspot" style="top: 35%; left: 10%; width: 30%; height: 28%;"></div>
    <div id="rodin-legs" class="hotspot" style="top: 60%; left: 10%; width: 35%; height: 25%;"></div>
    
    <div id="maitreya-head" class="hotspot" style="top: 15%; right: 13%; width: 25%; height: 20%;"></div>
    <div id="maitreya-torso" class="hotspot" style="top: 35%; right: 10%; width: 35%; height: 28%;"></div>
    <div id="maitreya-legs" class="hotspot" style="top: 60%; right: 10%; width: 40%; height: 25%;"></div>
</div>

<script>
    let currentMode = 1; 
    let currentStage2Mode = ''; 
    let dialogueIndex = 0;
    let aiDialogueCount = 0;
    let userPersona = ""; 
    let avatarModeActive = false; 
    let dialogueSessionData = []; 
    
    let maitreyaClickCounts = { head: 0, torso: 0, legs: 0 };
    let rodinClickCounts = { head: 0, torso: 0, legs: 0 };
    
    let mirrorCheck = { rodin_head: false, rodin_torso: false, head: false, torso: false, legs: false }; 
    let isStage3AllCompleted = false; 
    
    let currentAudioFile = null;
    let onSubtitleNext = null; 
    let stage3Timeout = null; 
    let audioCtx = null;
    let skipTriggered = false; 

    const svg = document.getElementById('shape-svg');
    const subBox = document.getElementById('sub-box');
    const container = document.getElementById('game-container');
    const mirrorGuide = document.getElementById('mirror-guide');
    const modeBtn = document.getElementById('mode-btn');
    const aiGroup = document.getElementById('ai-scenario-group');
    const mainTitle = document.getElementById('main-title');
    const labelContainer = document.getElementById('label-btn-container');

    // 한 페이지 보기 전용 데이터 구성
    const pageData = {
        intro: {
            title: "공(空)의 공명: 작품 소개",
            text: `
                <h3>전시 개요</h3>
                <p>본 전시는 서양의 '실존적 고뇌'를 형상화한 로댕의 <b>생각하는 사람</b>과, 동양의 '자비로운 사유'를 품은 <b>금동미륵보살반가사유상</b>의 영혼의 대화를 다룹니다. 동서양 철학의 두 정점이 마주하며 빚어내는 소리와 형태의 공명을 깊이 감상해보세요.</p>
                
                <h3>작가 철학 (Humartology)</h3>
                <p>성균관대학교 명예교수이자 휴마톨로지(Humartology)의 주창자인 <b>조준동(Jun Dong Cho) 교수</b>의 작품입니다. 기술에 인간의 감성과 예술적 가치를 녹여내는 철학을 바탕으로 설계되었습니다.</p>
                
                <h3>물아일체(物我일체)와 체화</h3>
                <p>예술을 단순히 눈으로만 보는 것을 넘어, 감상자의 신체를 직접 인터페이스 삼아 그 시대의 정신과 완벽하게 접속하는 '체화된 인지'의 경지를 지향합니다.</p>
                <p style="font-size:0.9rem; color:gray; text-align:center; margin-top:20px;">Copyright © 2026 조준동(Jun Dong Cho). All Rights Reserved.</p>
            `,
            tts: "공의 공명 작품 소개입니다. 본 전시는 서양의 실존적 고뇌와 동양의 자비로운 사유가 만나는 지점을 다룹니다. 성균관대학교 조준동 명예교수의 휴마톨로지 철학에 기반하여, 감상자의 신체를 인터페이스 삼는 체화된 인지와 물아일체의 경지를 지향합니다."
        },
        guide: {
            title: "전시 관람 가이드",
            text: `
                <p>본 전시는 감상자의 터치와 신체 공명을 기반으로 유기적으로 연결된 <b>총 4단계의 여정</b>으로 구성되어 있습니다.</p>
                
                <h3>단계별 관람 여정</h3>
                <ul>
                    <li><b>1단계: 조우 (Encounter)</b><br>두 조각상의 각 부위(머리, 상체, 하체)를 자유롭게 터치하여 그 안에 숨겨진 철학적 사유와 소리(사운드 스케이프)를 탐색합니다.</li>
                    <li><b>2단계: 공명의 시간 (Resonance)</b><br>화면에 나타나는 3가지 대화 모드(고정 대본 대화, AI 상호 사유, AI 감상자 개인 맞춤 대화) 중 하나를 선택하여 조각상들의 깊은 내면의 울림을 경청합니다.</li>
                    <li><b>3단계: 체화 명상 (Embodiment)</b><br>중앙 가이드를 보며 조각상의 명상 자세를 신체로 직접 모방하고 따라 하며 고뇌와 비움의 가치를 온몸으로 느끼는 단계입니다.</li>
                    <li><b>4단계: 여일 (Oneness)</b><br>고뇌와 자비가 하나의 중심 소리로 합일되며, 완벽한 영혼의 여백과 마주하는 정적의 시공간입니다.</li>
                </ul>
            `,
            tts: "전시 관람 가이드입니다. 본 전시는 총 4단계로 구성되어 있습니다. 1단계 조우에서는 각 조각상을 자유롭게 터치하여 사유를 탐색하고, 2단계 공명에서는 조각상들 간의 가상 및 인공지능 대화를 경청합니다. 3단계 체화에서는 표시되는 중앙 가이드를 보며 명상 포즈를 신체로 직접 따라하고, 4단계 여일에서는 정적의 합일을 감상하는 여정입니다."
        }
    };

    const fixedScript = [
        { name: "생각하는 사람", speaker: "rodin", text: "이 끝없는 고뇌의 무게는 언제쯤 가벼워질 수 있는가.", color: "#ff4500" },
        { name: "반가사유상", speaker: "maitreya", text: "무게를 느끼는 그 마음조차 찰나에 흐르는 바람일 뿐입니다.", color: "gold" },
        { name: "생각하는 사람", speaker: "rodin", text: "비워낸다는 것, 그것은 실존의 고통 속에서 너무나 아득한 길입니다.", color: "#ff4500" },
        { name: "반가사유상", speaker: "maitreya", text: "고통을 쥐어짜는 손을 가만히 놓아보십시오. 그곳에 본래 번뇌 없는 허공이 있습니다.", color: "gold" },
        { name: "생각하는 사람", speaker: "rodin", text: "인간이란 내면의 거울로 비추는 자신의 모습과 외부 세계의 시선을 통해 자신을 재현하는 이중적인 존재로 지내야 하는 괴로운 운명을 살아가고 있지 않은가.", color: "#ff4500" },
        { name: "반가사유상", speaker: "maitreya", text: "만물이 공명하는 이 세계에서, 우리 조각상의 깊은 마음은 나뭇잎이 가벼운 바람에 흔들리듯 우주의 진실을 간직한 채 감춰진 진리를 추구하고 있을 뿐입니다.", color: "gold" },
        { name: "생각하는 사람", speaker: "rodin", text: "인간의 삶은 종종 겉과 속이 서로 다른 이중 세계를 구축하는 것처럼 보인다. 깊은 내면에서 울분하고 두려움을 느끼면서도, 세상 앞에서는 늘 강한 표정으로 대치하며 방황과 고통의 열기를 불러온다.", color: "#ff4500" },
        { name: "반가사유상", speaker: "maitreya", text: "그 방황과 고통의 열기야말로 바로 우리에게 진정한 자각을 선물하는 것입니다. 무거운 짐을 내려놓을 때 비로소 참된 평온이 찾아옵니다.", color: "gold" }
    ];

    const stage1Data = {
        rodin_head: {
            philosophy: "상단. 숙인 고개와 굳게 다문 입술은 실존적 고뇌의 무게를 드러냅니다. 이는 '나는 누구인가'라는 질문 아래 안으로 굽어드는 수축된 사유의 형태입니다.",
            poetry: "미간에 패인 깊은 골, 닫힌 입술 사이로 흐르는 무거운 침묵. 고뇌가 원이 되어 가슴 속으로 파고드네.",
            draw: () => drawCircle(30, 30, 55, '#ff4500')
        },
        rodin_torso: {
            philosophy: "중단. 뒤틀린 상체와 수축된 근육은 중력이 육체를 끌어내리는 존재적 불안을 형상화했습니다. 이는 피할 수 없는 생의 고통을 의미합니다.",
            poetry: "뒤틀린 등 근육에 서린 팽팽한 긴장, 무거운 중력이 선율이 되어 대지로 가라앉네.",
            draw: () => drawPolygon("25,35 15,55 35,55", '#ff4500')
        },
        rodin_legs: {
            philosophy: "하단. 대지를 딛고 있는 거친 발과 근육은 실존적 고뇌를 지탱하는 인간의 육체적 한계를 드러냅니다.",
            poetry: "거친 발가락 끝에 맺힌 대지의 질감, 고뇌를 지탱하는 육체의 무거운 심장 박동.",
            draw: () => drawPolygon("15,65 35,65 35,85 15,85", '#ff4500')
        },

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playEarcon(speaker) {
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const panner = audioCtx.createStereoPanner();

        if (speaker === 'rodin') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(120, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
            panner.pan.value = -0.8; gain.gain.setValueAtTime(0.8, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        } else {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(1200, now);
            panner.pan.value = 0.8; gain.gain.setValueAtTime(0.3, now);
            osc.frequency.linearRampToValueAtTime(1210, now + 0.1); 
            gain.gain.exponentialRampToValueAtTime(0.01, now + 1.2);
        }
        osc.connect(gain).connect(panner).connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 20);
    }

    function speak(text, callback = null) {
        window.speechSynthesis.cancel();
        skipTriggered = false;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ko-KR';
        u.onend = () => { 
            if (!skipTriggered && callback) { callback(); } 
        };
        window.speechSynthesis.speak(u);
    }

    function speakSpatial(text, speaker, onEnd) {
        initAudio();
        window.speechSynthesis.cancel();
        playEarcon(speaker);
        skipTriggered = false;

        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ko-KR';
        u.pitch = (speaker === 'rodin') ? 0.7 : 1.2;
        u.onend = () => {
            if (!skipTriggered && onEnd) { onEnd(); }
        };
        setTimeout(() => { window.speechSynthesis.speak(u); }, 300);
    }

    function stopAllPlayback() {
        window.speechSynthesis.cancel();
        if (currentAudioFile) { currentAudioFile.pause(); currentAudioFile.currentTime = 0; currentAudioFile = null; }
        if (stage3Timeout) { clearTimeout(stage3Timeout); stage3Timeout = null; }
    }

    function skipAndNext() {
        if (!isSpeakingNow() && !currentAudioFile) return; 
        skipTriggered = true;
        window.speechSynthesis.cancel();
        if (currentAudioFile) { currentAudioFile.pause(); currentAudioFile.currentTime = 0; currentAudioFile = null; }
        
        if (onSubtitleNext) {
            const nextAction = onSubtitleNext;
            onSubtitleNext = null; 
            nextAction();
        } else {
            subBox.style.display = 'none';
        }
    }

    function handleInteraction(id) {
        if (currentMode !== 1) return;
        stopAllPlayback();
        svg.innerHTML = ''; 
        
        const key = id.replace(/-/g, '_');
        const part = key.split('_')[1];

        if (key.startsWith('maitreya')) {
            maitreyaClickCounts[part]++;
            if (maitreyaClickCounts[part] === 1) executeStage1(key, 'philosophy');
            else if (maitreyaClickCounts[part] === 2) executeStage1(key, 'poetry');
            else if (maitreyaClickCounts[part] === 3) {
                const item = stage1Data[key]; item.draw();
                showSubtitle(`<b>[사운드 스케이프 재생]</b><br>공(空)의 진동이 울려 퍼집니다.`, "gold");
                if (item.sound) item.sound();
                maitreyaClickCounts[part] = 0; 
            }
        } else if (key.startsWith('rodin')) {
            rodinClickCounts[part]++;
            if (rodinClickCounts[part] === 1) executeStage1(key, 'philosophy');
            else { executeStage1(key, 'poetry'); rodinClickCounts[part] = 0; }
        }
    }

            speakSpatial(line.text, line.speaker, () => {

            });
        } else {

        }

            rodin_torso: { text: "생각하는 사람의 웅크린 상체입니다. 근육을 수축시키고 몸을 강하게 숙여 실존의 무게를 온몸으로 견디는 긴장감을 재현해 보세요.", color: "#ff4500", label: "웅크린 상체" },
            head: { text: "반가사유상의 머리입니다. 입가에 잔잔하고 은은한 미소를 머금고, 오른쪽 손가락 끝을 오른쪽 뺨에 살짝 대어 비움의 사유를 느껴보세요.", color: "gold", label: "자비의 미소" },
            torso: { text: "반가사유상의 가슴입니다. 어깨와 상체의 긴장을 완벽하게 풀고 당당하면서도 유연하게 가슴을 활짝 열어 조화의 여백을 만드세요.", color: "gold", label: "평온한 상체" },
            legs: { text: "반가사유상의 반가좌입니다. 오른쪽 다리를 왼쪽 무릎 위에 가만히 올리며, 불균형 속에서 찾아내는 절대적인 평온และ 중용을 느껴보세요.", color: "gold", label: "반가좌 자세" }
        };

        const item = content[part];
        if (!item) return;
        
        if ((part === 'head' || part === 'torso' || part === 'legs') && (!mirrorCheck.rodin_head || !mirrorCheck.rodin_torso)) {
            showSubtitle(`<b>체화 안내</b><br>먼저 좌측 '생각하는 사람'의 고뇌 부위(머리, 상체)를 모두 따라 하셔야 자비와 비움의 단계로 이행할 수 있습니다.`, "white");
            speak("먼저 생각하는 사람의 고뇌 부위를 모두 따라 하셔야 합니다.");
            return;
        }

        showSubtitle(`
            <b>[체화 동작 명상: ${item.label}]</b><br>${item.text}
            <div style='text-align:center; margin-top:20px;'>
                <span style='color:#fff; font-weight:bold; font-size:1.1rem; display:block; margin-bottom:10px;'>동작을 몸으로 온전히 따라 하셨습니까?</span>
                <button class='confirm-btn' onclick='window.confirmStage3Part("${part}")'>예 (YES)</button>
            </div>
        `, item.color);

        speak(item.text + " 동작을 온전히 따라 하셨습니까? 완료하셨다면 예 버튼을 눌러주세요.");
    }

    window.confirmStage3Part = function(part) {
        if (stage3Timeout) { clearTimeout(stage3Timeout); stage3Timeout = null; }
        
        mirrorCheck[part] = true;
        updateCentralGauge();
        window.speechSynthesis.cancel();

        if (mirrorCheck.rodin_head && mirrorCheck.rodin_torso && mirrorCheck.head && mirrorCheck.torso && mirrorCheck.legs) {
            isStage3AllCompleted = true; 
            
            const finalQuestion = "모든 신체 자세를 체화하는 데 성공하셨습니다. 고뇌가 자비로운 미소를 통해 지극한 내면의 평화로 승화됨을 느끼셨습니까? 준비가 되셨다면 상단의 '다음 단계: 여일' 버튼을 터치하여 여일의 장을 여십시오.";
            showSubtitle(`<b>3단계 체화 완료</b><br>${finalQuestion}`, "white");
            speak(finalQuestion);
            
            setTimeout(() => { if(mirrorGuide) mirrorGuide.style.display = 'none'; }, 3000);
        } else {
            document.getElementById('mirror-text').innerText = "체화 완료. 다음 부위를 선택하세요.";
            subBox.style.display = 'none';
        }
    };

    function startStageFinal() {
        initAudio();
        stopAllPlayback();
        if (mirrorGuide) mirrorGuide.style.display = 'none';
        document.querySelectorAll('.hotspot').forEach(el => el.style.display = 'none');
        
        mainTitle.innerText = "반가사유: 사유의 소리 (4단계: 여일)"; 
        modeBtn.innerText = "단계 4: 여일"; 
        modeBtn.disabled = true;

        const introMsg = "여일의 단계입니다.";
        const coreMsg = "고뇌와 자비가 이제 하나의 울림이 되어 마음의 중심으로 완벽하게 합쳐집니다. 깊은 범종의 향이 정적으로 가라앉는 순간, 당신 안의 광활한 여백과 마주해 보세요.";
        const finalZen = "당신이 곧 우주이자 사유 그 자체입니다.";

        showSubtitle(`<b>여일: 합일의 소리</b>`, "white", () => {
            playCoreFinalSequence(coreMsg, finalZen);
        });

        speak(introMsg, () => {
            playCoreFinalSequence(coreMsg, finalZen);
        });

        const now = audioCtx.currentTime;
        [-0.8, 0.8].forEach((startPan) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const panner = document.getElementById('shape-svg') ? audioCtx.createStereoPanner() : null;
            if(!panner) return;
            osc.frequency.setValueAtTime(startPan < 0 ? 110 : 164.81, now);
            panner.pan.setValueAtTime(startPan, now);
            panner.pan.linearRampToValueAtTime(0, now + 15); 
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.04, now + 2);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 20);
            osc.connect(gain).connect(panner).connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 20);
        });
    }

    function playCoreFinalSequence(coreMsg, finalZen) {
        showSubtitle(`<b>여일</b><br>${coreMsg}`, "white", () => {
            playZenEndSequence(finalZen);
        });
        speak(coreMsg, () => {
            playZenEndSequence(finalZen);
        });
    }

    function playZenEndSequence(finalZen) {
        currentAudioFile = new Audio('Sacred_Morning.mp4');
        currentAudioFile.play().catch(e=>console.log(e));
        
        container.classList.add('purifying');
        showSubtitle(`<b>[물아일체(물아일체)]</b><br>${finalZen}`, "gold", () => {
            triggerAbsoluteSilence();
        });

        setTimeout(() => {
            triggerAbsoluteSilence();
        }, 12000); 
    }

    function triggerAbsoluteSilence() {
        container.classList.remove('purifying');
        container.classList.add('total-silence');
        const emptyZen = "비어있기에 당신은 무엇이든 채울 수 있습니다. 완벽한 영혼의 여백을 누리십시오.";
        showSubtitle(`<b>[여일]</b><br>${emptyZen}`, "black");
        modeBtn.innerText = "다시 시작"; 
        modeBtn.disabled = false;
        onSubtitleNext = null;
    }

    function showSubtitle(html, borderColor, nextCallback = null) {
        subBox.innerHTML = html;
        subBox.style.display = 'inline-block';
        subBox.style.borderColor = borderColor;
        onSubtitleNext = nextCallback; 
    }

    subBox.addEventListener('click', (e) => {
        if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
        
        if (currentMode === 2 || currentMode === 4 || onSubtitleNext !== null) {
            skipAndNext();
        } else {
            subBox.style.display = 'none';
        }
    });

    function drawCircle(cx, cy, r, color) {
        svg.innerHTML += `<circle cx="${cx}%" cy="${cy}%" r="${r}" stroke="${color}" stroke-width="4" fill="rgba(255,215,0,0.03)" />`;
    }
    
    function drawPolygon(points, color) {
        const formatted = points.split(' ').map(p => { const [x, y] = p.split(','); return `${x}% ${y}%`; }).join(' ');
        svg.innerHTML += `<polygon points="${formatted}" stroke="${color}" stroke-width="4" fill="rgba(255,215,0,0.03)" />`;
    }

    document.getElementById('sub-box').style.wordBreak = 'keep-all';

    function updateCentralGauge() {
        const gauge = document.getElementById('gauge-progress'); if (!gauge) return;
        const completedCount = Object.values(mirrorCheck).filter(v => v === true).length;
        const circumference = 2 * Math.PI * 60; 
        gauge.style.strokeDashoffset = circumference - (completedCount / 5) * circumference;
    }

    async function fetchAITalk(prompt) {
        try {
            const response = await fetch("http://localhost:1234/v1/chat/completions", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "meta-llama-3.1-8b-instruct",
                    messages: [
                        { role: "system", content: "당신은 깊은 성찰을 지닌 철학적 조각상의 영혼입니다. 고풍스럽고 정제된 품격 있는 한국어 문장으로 답변하세요." },
                        { role: "user", content: prompt }
                    ],
                    temperature: 0.7, max_tokens: 150
                })
            });
            const data = await response.json();
            return data.choices[0].message.content;
        } catch (error) {
            console.error("AI 서버 통신 오류:", error);
            return "깊은 침묵만이 흐르고 있습니다. (내부 인공지능 서버의 상태를 확인하여 주십시오.)";
        }
    }

    function downloadLogFile(data) {
        if (data.length === 0) return;
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'ao.out'; a.click();
    }

    ['rodin-head', 'rodin-torso', 'rodin-legs', 'maitreya-head', 'maitreya-torso', 'maitreya-legs'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            el.addEventListener('click', () => {
                initAudio();
                if (currentMode === 1) handleInteraction(id);
                else if (currentMode === 2) handleHotspotClick(id.split('-')[0]);
                else if (currentMode === 3) handleStage3Interaction(id.replace(/-/g, '_').replace('maitreya_', ''));
            });
        }
    });
</script>
</body>
</html>
