<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>침묵의 공명: 고뇌와 자비의 조우 (Humartology Edition)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;700&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: rgba(212,175,55,0.85);
            --gold-dim: rgba(212,175,55,0.3);
            --rodin-color: #e05533;
            --maitreya-color: #d4af37;
            --bg: #000;
            --surface: rgba(10,10,10,0.92);
        }

        * { box-sizing: border-box; }
        body { 
            margin: 0; background: #000; color: white; 
            font-family: 'Noto Serif KR', 'Pretendard', serif; 
            overflow: hidden; touch-action: manipulation; 
        }

        /* ── 게임 컨테이너 ── */
        #game-container { 
            position: relative; width: 100vw; height: 100vh; 
            background: url('반가-로댕.png') no-repeat center center; 
            background-size: contain;
            transition: opacity 2.5s ease-in-out;
        }

        /* ── 핫스팟 ── */
        .hotspot { position: absolute; cursor: pointer; z-index: 10; -webkit-tap-highlight-color: rgba(212,175,55,0.3); border-radius: 50%; }
        .hotspot:hover { background: rgba(212,175,55,0.08); }
        #rodin-head    { top:15%; left:16%; width:14%; height:14%; }
        #rodin-torso   { top:30%; left:10%; width:25%; height:25%; border-radius:40%; }
        #rodin-legs    { top:56%; left:8%;  width:26%; height:30%; border-radius:30%; }
        #maitreya-head { top:11%; left:69%; width:14%; height:14%; }
        #maitreya-torso{ top:26%; left:64%; width:24%; height:26%; border-radius:40%; }
        #maitreya-legs { top:53%; left:62%; width:28%; height:33%; border-radius:30%; }

        /* ── UI 레이어 ── */
        #ui-layer { 
            position: absolute; top:0; left:0; width:100%; height:100%; 
            pointer-events: none; z-index: 20; 
            display: flex; flex-direction: column; justify-content: space-between;
            padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)) 16px; 
        }

        /* ── 헤더 ── */
        #header-group { display: flex; justify-content: space-between; align-items: flex-start; pointer-events: auto; gap: 8px; }
        
        .header-btn { 
            background: rgba(0,0,0,0.7); 
            border: 1px solid var(--gold-dim); 
            color: var(--gold); 
            padding: 9px 16px; border-radius: 22px; 
            font-family: 'Noto Serif KR', serif;
            font-size: 0.82rem; font-weight: 600; 
            backdrop-filter: blur(10px); cursor: pointer; 
            transition: all 0.25s; white-space: nowrap;
            box-shadow: 0 2px 12px rgba(0,0,0,0.5);
        }
        .header-btn:active, .header-btn:hover { background: var(--gold); color: #000; }
        
        #main-title { 
            font-family: 'Cinzel Decorative', serif;
            font-size: clamp(0.65rem, 1.8vw, 1rem); 
            color: var(--gold); 
            text-align: center;
            text-shadow: 0 0 20px rgba(212,175,55,0.6);
            letter-spacing: 0.06em;
            background: rgba(0,0,0,0.5); 
            padding: 8px 14px; border-radius: 12px; 
            backdrop-filter: blur(6px);
            border: 1px solid var(--gold-dim);
            flex: 1; margin: 0 8px;
        }

        /* ── 인터랙션 흐름 영역 ── */
        #interaction-flow-group { width: 100%; pointer-events: none; }
        
        #ai-scenario-group, #stage3-scenario-group { 
            display: none; gap: 8px; justify-content: center; 
            margin-bottom: 12px; pointer-events: auto; flex-wrap: wrap; 
        }
        
        .scenario-btn { 
            background: rgba(15,15,15,0.88); 
            border: 1px solid rgba(100,100,100,0.5); 
            color: #bbb; padding: 9px 16px; border-radius: 18px; 
            font-family: 'Noto Serif KR', serif;
            font-size: 0.8rem; cursor: pointer; 
            transition: all 0.3s; 
            backdrop-filter: blur(8px);
        }
        .scenario-btn.active { 
            background: var(--gold); color: #000; 
            border-color: var(--gold); font-weight: bold; 
            box-shadow: 0 0 16px rgba(212,175,55,0.5); 
        }

        /* ── 자막 박스 ── */
        #subtitle-box { 
            background: rgba(5,5,5,0.9); 
            border: 1px solid var(--gold-dim); 
            border-radius: 20px; padding: 20px 24px; 
            min-height: 60px; display: none; pointer-events: auto; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.8), 0 0 40px rgba(212,175,55,0.08);
            backdrop-filter: blur(16px); 
            text-align: left; 
            max-width: 680px; margin: 0 auto; width: 95%;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
        #subtitle-box b { 
            font-size: 1.05rem; display: block; 
            margin-bottom: 6px; letter-spacing: 0.02em; 
            font-family: 'Cinzel Decorative', serif;
        }
        #subtitle-box p { margin: 0; font-size: 0.95rem; line-height: 1.7; color: #ccc; word-break: keep-all; }

        /* ── 거울 가이드 ── */
        #mirror-guide-container { 
            position: absolute; top:0; left:0; width:100%; height:100%; 
            pointer-events: none; z-index: 2; display: none; 
        }
        .mirror-box { 
            position: absolute; border: 2px dashed rgba(255,255,255,0.2); 
            background: rgba(255,255,255,0.02); 
            border-radius: 12px; 
            display: flex; justify-content: center; align-items: center; 
            color: rgba(255,255,255,0.35); font-size: 0.78rem; font-weight: 500; 
            transition: all 0.5s ease; 
        }
        .mirror-box.active { 
            border-color: var(--gold); background: rgba(212,175,55,0.06); 
            color: var(--gold); 
            box-shadow: inset 0 0 20px rgba(212,175,55,0.12), 0 0 20px rgba(212,175,55,0.1); 
        }

        /* ── SVG 레이어 ── */
        #shape-svg { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 5; }

        /* ── 작품 소개 / 사용법 오버레이 ── */
        .info-page-overlay {
            position: fixed; top:0; left:0; width:100vw; height:100vh;
            background: rgba(0,0,0,0.96); z-index: 300; display: none;
            justify-content: center; align-items: center;
            padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px) 20px;
        }
        .info-page-content {
            background: rgba(8,8,8,0.99); 
            border: 1px solid var(--gold-dim);
            border-radius: 20px; width: 92%; max-width: 680px; max-height: 84vh;
            overflow-y: auto; padding: 32px 28px;
            box-shadow: 0 0 60px rgba(212,175,55,0.2); 
            animation: slideUp 0.35s ease-out;
            scrollbar-width: thin; scrollbar-color: var(--gold) rgba(0,0,0,0.3);
        }
        .info-page-content::-webkit-scrollbar { width: 5px; }
        .info-page-content::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 8px; }
        .info-page-title { 
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.3rem; color: var(--gold); 
            margin: 0 0 18px; text-align: center; 
            border-bottom: 1px solid var(--gold-dim); padding-bottom: 14px; 
        }
        .info-page-body { font-size: 0.95rem; line-height: 1.9; color: #ccc; word-break: keep-all; }
        .info-page-body h3 { color: #e8c84a; margin: 20px 0 8px; font-size: 1rem; letter-spacing: 0.03em; }
        .info-page-body p, .info-page-body li { color: #bbb; margin-bottom: 8px; }
        .info-page-body ul { padding-left: 16px; }
        .close-info-btn {
            display: block; width: 100%; margin-top: 24px; padding: 13px 0;
            background: var(--gold); color: #000; border: none; border-radius: 12px;
            font-family: 'Noto Serif KR', serif;
            font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.25s;
        }
        .close-info-btn:hover { background: #fff; }

        /* ── 챗봇 ── */
        #chatbot-container {
            position: absolute; bottom: 100px; right: 30px;
            width: 300px; height: 300px; z-index: 100;
            display: none; flex-direction: column;
            background: rgba(4,4,4,0.95); 
            border: 1px solid var(--gold);
            border-radius: 16px; overflow: hidden;
            box-shadow: 0 6px 30px rgba(0,0,0,0.7), 0 0 30px rgba(212,175,55,0.1);
        }
        @media (max-width: 1100px) { #chatbot-container { right: auto !important; left: 12px !important; bottom: 90px !important; } }
        @media (max-width: 600px)  { #chatbot-container { width: calc(100% - 24px) !important; left: 12px !important; bottom: 100px !important; height: 340px !important; } }
        #chat-messages { flex: 1; overflow-y: auto; padding: 10px; font-size: 0.86rem; line-height: 1.5; scrollbar-width: thin; scrollbar-color: var(--gold) rgba(0,0,0,0.3); }
        #chat-messages::-webkit-scrollbar { width: 4px; }
        #chat-messages::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }

        /* ── 4단계 피날레 ── */
        #finale-overlay {
            position: fixed; top:0; left:0; width:100vw; height:100vh;
            background: #000; z-index: 500; display: none;
            justify-content: center; align-items: center; flex-direction: column;
            opacity: 0; transition: opacity 2.5s ease-in-out;
        }
        #finale-overlay.visible { opacity: 1; }
        #finale-canvas { display: block; }
        #finale-text {
            position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%);
            text-align: center; color: var(--gold-light);
            font-family: 'Cinzel Decorative', serif;
            font-size: clamp(0.85rem, 2.2vw, 1.2rem);
            letter-spacing: 0.15em; line-height: 2.2;
            opacity: 0; transition: opacity 3s ease-in-out 1.5s;
            pointer-events: none; white-space: nowrap;
        }
        #finale-text.visible { opacity: 1; }
        #finale-restart {
            position: absolute; bottom: 6%; left: 50%; transform: translateX(-50%);
            background: transparent; border: 1px solid var(--gold-dim);
            color: var(--gold-light); padding: 11px 30px; border-radius: 25px;
            font-family: 'Noto Serif KR', serif;
            font-size: 0.88rem; cursor: pointer; letter-spacing: 0.08em;
            opacity: 0; transition: opacity 2s ease-in-out 5s, border-color 0.3s, color 0.3s;
        }
        #finale-restart.visible { opacity: 1; }
        #finale-restart:hover { border-color: var(--gold); color: var(--gold); }

        /* ── 확인 버튼 공통 ── */
        .confirm-btn { 
            background: var(--gold); color: #000; border: none; 
            padding: 11px 26px; border-radius: 24px; 
            font-family: 'Noto Serif KR', serif;
            font-size: 0.95rem; font-weight: 700; cursor: pointer; 
            margin-top: 14px; 
            box-shadow: 0 4px 14px rgba(212,175,55,0.4); 
            transition: transform 0.2s; 
        }
        .confirm-btn:active { transform: scale(0.96); }

        /* ── 탐색 힌트 오버레이 ── */
        #explore-hint {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            pointer-events: none; z-index: 8; text-align: center;
            animation: fadeHint 4s ease-in-out 2s forwards;
        }
        @keyframes fadeHint {
            0% { opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; }
        }
        .hint-label {
            display: inline-block; background: rgba(0,0,0,0.75);
            border: 1px solid var(--gold-dim); color: var(--gold);
            font-size: 0.78rem; padding: 6px 14px; border-radius: 20px;
            letter-spacing: 0.06em; margin: 4px;
            backdrop-filter: blur(8px);
        }

        /* ── 스테이지 배지 ── */
        .stage-badge {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: 0.7rem; letter-spacing: 0.05em; opacity: 0.7;
            color: var(--gold);
        }
        .stage-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }
    </style>
</head>
<body>

<!-- ── 사운드트랙 매핑 ──
     rodin-head    : The_Silent_Weight_of_Stone
     rodin-torso   : The_Weight_of_Bronze
     rodin-legs    : Bearing_the_Bedrock
     maitreya-head : 손끝에_맺힌_온기
     maitreya-torso: Where_Bamboo_Bends
     maitreya-legs : Beneath_the_Temple_Floor
     stage-2 공명  : Echoes_of_the_Void
     finale        : Sacred_Morning
─────────────────────────────────────────── -->
<audio id="snd-rodin-head"     src="The_Silent_Weight_of_Stone.mp4" preload="auto"></audio>
<audio id="snd-rodin-torso"    src="The_Weight_of_Bronze.mp4"       preload="auto"></audio>
<audio id="snd-rodin-legs"     src="Bearing_the_Bedrock.mp4"        preload="auto"></audio>
<audio id="snd-maitreya-head"  src="손끝에_맺힌_온기.mp4"            preload="auto"></audio>
<audio id="snd-maitreya-torso" src="Where_Bamboo_Bends.mp4"         preload="auto"></audio>
<audio id="snd-maitreya-legs"  src="Beneath_the_Temple_Floor.mp4"   preload="auto"></audio>
<audio id="snd-void"           src="Echoes_of_the_Void.mp4"         preload="auto" loop></audio>
<audio id="snd-finale"         src="Sacred_Morning.mp4"             preload="auto" loop></audio>

<!-- ── 작품 소개 / 사용법 오버레이 ── -->
<div id="info-overlay" class="info-page-overlay" onclick="closeInfoOverlay(event)">
    <div class="info-page-content" onclick="event.stopPropagation()">
        <h2 id="info-overlay-title" class="info-page-title"></h2>
        <div id="info-overlay-body" class="info-page-body"></div>
        <button class="close-info-btn" onclick="closeInfoOverlay(null)">닫기</button>
    </div>
</div>

<!-- ── 챗봇: 사유의 상담소 ── -->
<div id="chatbot-container">
    <div style="background:var(--gold);color:#000;padding:10px 14px;font-weight:bold;font-family:'Cinzel Decorative',serif;text-align:center;display:flex;justify-content:space-between;align-items:center;font-size:0.82rem;">
        <span>✦ 사유의 상담소</span>
        <button onclick="document.getElementById('chatbot-container').style.display='none'" style="background:none;border:none;color:#000;font-weight:bold;cursor:pointer;font-size:1.1rem;line-height:1;">✕</button>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px;background:rgba(12,12,12,0.98);border-bottom:1px solid var(--gold-dim);">
        <button onclick="setChatCategory('전체')"   style="padding:3px 9px;background:rgba(212,175,55,0.12);color:var(--gold);border:1px solid var(--gold-dim);border-radius:10px;font-size:0.7rem;cursor:pointer;">전체</button>
        <button onclick="setChatCategory('작품론')" style="padding:3px 9px;background:rgba(212,175,55,0.12);color:var(--gold);border:1px solid var(--gold-dim);border-radius:10px;font-size:0.7rem;cursor:pointer;">작품론</button>
        <button onclick="setChatCategory('비교철학')" style="padding:3px 9px;background:rgba(212,175,55,0.12);color:var(--gold);border:1px solid var(--gold-dim);border-radius:10px;font-size:0.7rem;cursor:pointer;">비교철학</button>
        <button onclick="setChatCategory('예술기법')" style="padding:3px 9px;background:rgba(212,175,55,0.12);color:var(--gold);border:1px solid var(--gold-dim);border-radius:10px;font-size:0.7rem;cursor:pointer;">예술기법</button>
        <button onclick="setChatCategory('사유명상')" style="padding:3px 9px;background:rgba(212,175,55,0.12);color:var(--gold);border:1px solid var(--gold-dim);border-radius:10px;font-size:0.7rem;cursor:pointer;">사유명상</button>
    </div>
    <div id="chat-messages">
        <div style="margin-bottom:10px;color:var(--gold);font-size:0.86rem;line-height:1.6;">조각상: 당신의 깊은 고민이나 궁금증을 물어보세요.<br>사유의 길을 함께 찾겠습니다.</div>
    </div>
    <div style="padding:8px;display:flex;gap:5px;background:rgba(255,255,255,0.04);border-top:1px solid var(--gold-dim);">
        <input type="text" id="chat-input" style="flex:1;border-radius:8px;border:1px solid var(--gold-dim);padding:8px 10px;outline:none;font-size:0.82rem;background:#0a0a0a;color:#fff;font-family:'Noto Serif KR',serif;" placeholder="질문을 입력하세요..." onkeydown="if(event.key==='Enter')handleChat()">
        <button onclick="handleChat()" style="background:var(--gold);border:none;padding:6px 13px;border-radius:8px;font-weight:bold;cursor:pointer;font-family:'Noto Serif KR',serif;">전송</button>
    </div>
</div>

<!-- ── 4단계 피날레 ── -->
<div id="finale-overlay">
    <canvas id="finale-canvas"></canvas>
    <div id="finale-text">침묵 속에서<br>당신은 이미 완전합니다<br>無</div>
    <button id="finale-restart" onclick="resetGame()">처음으로 돌아가기</button>
</div>

<!-- ── 메인 게임 컨테이너 ── -->
<div id="game-container">
    <svg id="shape-svg"></svg>
    <div id="mirror-guide-container"></div>

    <div id="explore-hint" style="display:none;">
        <div class="hint-label">← 로댕의 머리를 터치하세요</div>
        <div class="hint-label">반가사유상을 터치하세요 →</div>
    </div>

    <div class="hotspot" id="rodin-head"></div>
    <div class="hotspot" id="rodin-torso"></div>
    <div class="hotspot" id="rodin-legs"></div>
    <div class="hotspot" id="maitreya-head"></div>
    <div class="hotspot" id="maitreya-torso"></div>
    <div class="hotspot" id="maitreya-legs"></div>

    <div id="ui-layer">
        <div id="header-group">
            <div style="display:flex;flex-direction:column;gap:6px;">
                <button class="header-btn" onclick="openInfoOverlay('intro')">작품 소개</button>
                <button class="header-btn" onclick="openInfoOverlay('guide')">사용법</button>
            </div>
            <div id="main-title">침묵의 공명</div>
            <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">
                <button class="header-btn" id="reset-btn" onclick="resetGame()">다시 조우</button>
                <button class="header-btn" id="mode-btn" onclick="toggleMode()">단계 1: 조우</button>
            </div>
        </div>

        <div id="interaction-flow-group">
            <div id="ai-scenario-group" style="display:flex;">
                <button class="scenario-btn" onclick="selectScenario(1)">① 생성과 소멸</button>
                <button class="scenario-btn" onclick="selectScenario(2)">② 실존과 초월</button>
                <button class="scenario-btn" onclick="selectScenario(3)">③ 문명과 침묵</button>
            </div>
            <div id="stage3-scenario-group">
                <button class="scenario-btn" id="s3-btn-1" onclick="selectStage3Part('head')">머리 사유</button>
                <button class="scenario-btn" id="s3-btn-2" onclick="selectStage3Part('torso')">상체 비움</button>
                <button class="scenario-btn" id="s3-btn-3" onclick="selectStage3Part('legs')">하체 안착</button>
            </div>
            <div id="subtitle-box"></div>
        </div>
    </div>
</div>

<script>
// ══════════════════════════════════════════════════════
// ── [0] 웹 오디오 코어 시스템 ──
// ══════════════════════════════════════════════════════
let audioCtx = null, masterGain = null, currentOsc = null, drumInterval = null;

function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    masterGain.connect(audioCtx.destination);
}

function playResonanceSound(freq, type, duration) {
    if (!audioCtx) initAudio();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(0.28, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(g); g.connect(masterGain);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
}

function triggerBell() { playResonanceSound(523.25, 'sine', 3.5); }
function triggerDrum() { playResonanceSound(80, 'triangle', 0.8); }

function stopAllPlayback() {
    if (currentOsc) { try { currentOsc.stop(); } catch(e){} currentOsc = null; }
    if (drumInterval) { clearInterval(drumInterval); drumInterval = null; }
    window.speechSynthesis.cancel();
    _stopMp4All();
}

// ── MP4 사운드트랙 제어 ──
const _mp4Ids = ['snd-rodin-head','snd-rodin-torso','snd-rodin-legs','snd-maitreya-head','snd-maitreya-torso','snd-maitreya-legs','snd-void','snd-finale'];
let _mp4FadeTimer = null;

function _stopMp4All() {
    if (_mp4FadeTimer) { clearTimeout(_mp4FadeTimer); _mp4FadeTimer = null; }
    _mp4Ids.forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.pause(); el.currentTime = 0; el.volume = 1;
    });
}

function _playMp4(id, vol, autostopSec) {
    _stopMp4All();
    const el = document.getElementById(id);
    if (!el) return;
    el.volume = 0; el.currentTime = 0;
    el.play().catch(() => {});
    let v = 0; const step = vol / 12;
    const fi = setInterval(() => { v = Math.min(v + step, vol); el.volume = v; if (v >= vol) clearInterval(fi); }, 50);
    if (autostopSec > 0) { _mp4FadeTimer = setTimeout(() => _fadeOutMp4(el), autostopSec * 1000); }
}

function _fadeOutMp4(el) {
    if (!el || el.paused) return;
    const fo = setInterval(() => {
        el.volume = Math.max(el.volume - 0.05, 0);
        if (el.volume <= 0) { clearInterval(fo); el.pause(); el.currentTime = 0; }
    }, 80);
}

function _duckForSpeech(text, mp4El, fullVol, osc) {
    const DUCK_VOL = 0.04;
    if (mp4El && !mp4El.paused) mp4El.volume = DUCK_VOL;
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = 'ko-KR';
    msg.onend = () => {
        if (mp4El && !mp4El.paused) {
            let v = DUCK_VOL;
            const restore = setInterval(() => { v = Math.min(v + 0.04, fullVol); mp4El.volume = v; if (v >= fullVol) clearInterval(restore); }, 60);
        }
        if (osc) { try { osc.stop(); } catch(e){} }
        if (drumInterval) { clearInterval(drumInterval); drumInterval = null; }
    };
    window.speechSynthesis.speak(msg);
}

// ── TTS 함수 ──
function speak(text, onEnd) {
    window.speechSynthesis.cancel();
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = 'ko-KR';
    if (onEnd) msg.onend = onEnd;
    window.speechSynthesis.speak(msg);
}

function speakSpatial(text, speaker, onEnd) {
    window.speechSynthesis.cancel();
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = 'ko-KR';
    msg.rate = 0.95;
    if (onEnd) msg.onend = onEnd;
    window.speechSynthesis.speak(msg);
}

async function fetchAITalk(prompt) {
    try {
        const response = await fetch("http://localhost:1234/v1/chat/completions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "qwen2.5-1.5b-instruct",
                messages: [
                    { role: "system", content: "로댕의 생각하는 사람은 실존적 고뇌와 고통을, 반가사유상은 자비와 비움, 해탈을 상징합니다. 감상자에게 품격 있는 한국어로 짧게 답하세요." },
                    { role: "user", content: prompt }
                ],
                temperature: 0.75,
                max_tokens: 120
            })
        });
        const data = await response.json();
        return data.choices[0].message.content.trim();
    } catch (e) {
        console.error("AI 연결 오류:", e);
        return "침묵 속에서 답을 찾고 있습니다. (서버 연결을 확인해주세요)";
    }
}

    currentOsc.type = sound.soundType;
    currentOsc.frequency.setValueAtTime(sound.freq, audioCtx.currentTime);
    bGain.gain.setValueAtTime(isRodin ? 0.1 : 0.22, audioCtx.currentTime);

        rodinKeywords:"기계문명, 기술의 피로, 속도, 인간성 상실",

function startScenarioRun(title) {
    showSubtitle(`<b>시나리오: ${title}</b><p>두 거장의 영혼이 사유를 주고받기 시작합니다...</p>`, 'gold');
    setTimeout(() => triggerScenarioNode('rodin', 1), 2000);
}

async function triggerScenarioNode(speaker, depth) {
    if (!avatarModeActive || currentMode !== 2) return;
    isAIConversation = true;
    const isRodin = (speaker === 'rodin');
    const roleName = isRodin ? "로댕" : "반가사유상";
    const color = isRodin ? '#e05533' : 'gold';

    if (isRodin) { triggerDrum(); } else { triggerBell(); }
    drawPulseEffect(isRodin);
    if (depth === 1 && isRodin) _playMp4('snd-void', 0.15, 0);

    const spec = scenarioPrompts[selectedScenarioId] || scenarioPrompts[1];
    const persona  = isRodin ? spec.rodinPersona  : spec.maitreyaPersona;
    const keywords = isRodin ? spec.rodinKeywords : spec.maitreyaKeywords;

    const prompt = `당신은 명작 조각 [${roleName}]의 예술적 영혼입니다.
[이번 대화 주제]: ${spec.title}
[시나리오 콘텍스트]: ${spec.context}
[당신의 페르소나]: ${persona}
[핵심 키워드 (자연스럽게 녹여낼 것)]: ${keywords}
[현재 차례]: ${roleName} (${depth}/4)
[이전 대화]: ${JSON.stringify(dialogueSessionData)}
위 지침을 따라 이전 대화를 이어받아 품격 있는 한국어 딱 '한 문장'으로 답하시오. 이미 사용된 표현은 반드시 피하시오.`;

    try {
        showSubtitle(`<b>${roleName} 사유 중...</b>`, color);
        const textResult = await fetchAITalk(prompt);
        dialogueSessionData.push({ name: roleName, text: textResult });
        showSubtitle(`<b>${roleName}의 공명</b><p>${textResult}</p>`, color);
        speakSpatial(textResult, speaker, () => {
            if (depth < 4) {
                setTimeout(() => triggerScenarioNode(isRodin ? 'maitreya' : 'rodin', depth + 1), 1200);
            } else {
                finishStage2();
            }
        });
    } catch(e) {
        console.error(e);
        finishStage2();
    }
}

function finishStage2() {
    isAIConversation = false;
    const msg = "두 조각상의 공명이 완료되었습니다. 위 버튼으로 다음 단계로 나아가세요.";
    showSubtitle(`<b>공명 완료</b><p>${msg}</p>`, 'gold');
    speak(msg);
}

async function executeStage3AIRelay(speakerKey, userTroubleText) {
    if (!userTroubleText) return;
    isStage3AIConversation = true;

    const isRodin = (speakerKey === 'rodin');
    const role  = isRodin ? "로댕 (생각하는 사람)" : "반가사유상 (미륵보살)";
    const color = isRodin ? '#e05533' : 'gold';

    const basePersona = isRodin
        ? "실존의 고뇌, 인간의 한계, 끊임없는 사유의 고통을 짊어진 고독한 서양의 철학자"
        : "모든 번뇌를 초월한 채 찰나와 비움, 그리고 자비로운 미소로 중생을 품는 동양의 구도자";

    const promptTemplate = `귀하는 명작 [${role}]의 예술적 영혼이자 사유의 화신입니다.
[당신의 기본 페르소나]: ${basePersona}
[감상자가 토로한 삶의 고민]: "${userTroubleText}"
[정밀 수행 지침]:
1. 감상자가 토로한 고민의 깊이와 상황적 무게를 정밀하게 읽어내십시오.
2. ${isRodin
    ? '감상자의 고뇌에 깊이 공감하며 삶의 무게와 실존적 번뇌를 함께 아파하는 무겁고 격조 높은 철학적 문장으로 조언하십시오.'
    : '번뇌를 부드럽게 씻어주고 마음을 비워내게 유도하는 반가사유상 특유의 자비롭고 안온한 한 문장 위로를 하십시오.'}
3. 이전 조각상의 대화 기록이 있다면 그 흐름을 깊이 있게 이어받는 '릴레이 공명 방식'을 취하십시오.
[현재까지 진행된 릴레이 대화]: ${JSON.stringify(stage3DialogueSessionData)}
위 지침을 엄격히 준수하여, 격조 높고 정제된 한국어 딱 '한 문장'으로 최종 답변을 작성하십시오.`;

    try {
        showSubtitle(`<b>${role} 사유 중...</b>`, color);
        if (isRodin) { triggerDrum(); drawPulseEffect(true); } else { triggerBell(); drawPulseEffect(false); }

        const aiResponse = await fetchAITalk(promptTemplate);
        stage3DialogueSessionData.push({ name: role, speaker: speakerKey, text: aiResponse });
        showSubtitle(`<b>${role}의 공명</b><p>${aiResponse}</p>`, color);

        speakSpatial(aiResponse, speakerKey, () => {
            if (speakerKey === 'rodin') {
                setTimeout(() => executeStage3AIRelay('maitreya', userTroubleText), 1500);
            } else {
                showSubtitle("<b>사유의 체화 완료</b><p>두 조각상의 입체적 위로가 당신의 영혼에 체화되었습니다.</p>", 'gold');
                speak("두 조각상의 위로가 당신의 마음에 체화되었습니다.");
                downloadLogFile(stage3DialogueSessionData);
                isStage3AIConversation = false;

                const finishBtn = document.createElement('button');
                finishBtn.className = 'confirm-btn';
                finishBtn.innerText = "다음 체화 동작으로 →";
                finishBtn.onclick = function(ev) {
                    ev.stopPropagation();
                    if (currentPartInStage3 === 'head') selectStage3Part('torso');
                    else if (currentPartInStage3 === 'torso') selectStage3Part('legs');
                    else { currentMode = 4; startStageFinal(); }
                };
                subBox.appendChild(finishBtn);
            }
        });
    } catch(e) {
        console.error("3단계 AI 릴레이 오류:", e);
        showSubtitle("사유의 통로가 잠시 혼잡합니다. 잠시 후 다시 공명 버튼을 눌러주십시오.", 'red');
        isStage3AIConversation = false;
    }
}

function downloadLogFile(data) {
    if (!data.length) return;
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'ao.out'; a.click();
}

function triggerFinaleSequence() {
    const overlay = document.getElementById('finale-overlay');
    const canvas  = document.getElementById('finale-canvas');
    const text    = document.getElementById('finale-text');
    const restart = document.getElementById('finale-restart');

    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    overlay.style.display = 'flex';

    const gc = document.getElementById('game-container');
    gc.style.transition = 'opacity 2.5s ease-in-out';
    gc.style.opacity = '0';

    setTimeout(() => {
        overlay.classList.add('visible');
        text.classList.add('visible');
        restart.classList.add('visible');
        startFinaleCanvas(canvas);
    }, 500);
}

function startFinaleCanvas(canvas) {
    const ctx = canvas.getContext('2d');
    const cx = canvas.width / 2, cy = canvas.height / 2;
    let angle = 0, frame = 0;
    const circles = [
        { r:85,  speed:0.008, lineW:1.2, alpha:0.55 },
        { r:140, speed:0.005, lineW:1.0, alpha:0.38 },
        { r:205, speed:0.003, lineW:0.7, alpha:0.22 },
        { r:280, speed:0.002, lineW:0.5, alpha:0.14 }
    ];

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        circles.forEach((c, i) => {
            const a = angle * c.speed * 300 + i * Math.PI / 4;
            ctx.beginPath(); ctx.arc(cx, cy, c.r, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(212,175,55,${c.alpha})`; ctx.lineWidth = c.lineW; ctx.stroke();

            const dotX = cx + c.r * Math.cos(a), dotY = cy + c.r * Math.sin(a);
            const grad = ctx.createRadialGradient(dotX, dotY, 0, dotX, dotY, 8);
            grad.addColorStop(0, `rgba(255,220,100,${c.alpha * 1.8})`);
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.beginPath(); ctx.arc(dotX, dotY, 8, 0, Math.PI * 2);
            ctx.fillStyle = grad; ctx.fill();

            const dx2 = cx + c.r * Math.cos(a + Math.PI), dy2 = cy + c.r * Math.sin(a + Math.PI);
            const g2 = ctx.createRadialGradient(dx2, dy2, 0, dx2, dy2, 5);
            g2.addColorStop(0, `rgba(200,160,60,${c.alpha})`);
            g2.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.beginPath(); ctx.arc(dx2, dy2, 5, 0, Math.PI * 2);
            ctx.fillStyle = g2; ctx.fill();
        });

        const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 60);
        glow.addColorStop(0, 'rgba(212,175,55,0.18)'); glow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.beginPath(); ctx.arc(cx, cy, 60, 0, Math.PI * 2);
        ctx.fillStyle = glow; ctx.fill();

        ctx.font = `${Math.max(32, canvas.width * 0.055)}px serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = `rgba(212,175,55,${0.5 + 0.2 * Math.sin(frame * 0.018)})`;
        ctx.fillText('無', cx, cy);

        angle++; frame++;
        requestAnimationFrame(draw);
    }
    draw();
}
