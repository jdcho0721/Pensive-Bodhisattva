<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>침묵의 공명 — 모두를 위한 전시, 조각상을 만지다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;700&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════
   침묵의 공명 — 통합 셸
   ── 전시실 1(index.html→room1.html)과 전시실 2(index-room2.html→
      room2.html)는 각각 독립된 문서(고유한 #stage, #controls, speak()
      등)이므로, 하나의 DOM으로 직접 합치면 id/전역함수 충돌이 난다.
      대신 이 셸이 두 파일을 iframe으로 담고, 소개 화면 → 전시실1 →
      (자동) 전시실2 흐름과, 언제든 두 존을 오갈 수 있는 버튼을 제공한다.
   ── 전시실1이 원래 "다음 전시 단계로 이동하세요" 안내 후 처음부터
      반복하던 지점(restartFromBeginning)은, room1.html 안에서 이 셸에
      postMessage를 보내도록 살짝 손봐서(부모 창이 있을 때만) 자동으로
      전시실2로 넘어가게 했다.
   ══════════════════════════════════════════════════════ */
:root{
    --gold:#d4af37; --gold-light:rgba(212,175,55,.85); --gold-dim:rgba(212,175,55,.3);
    --bg:#000;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:#000;color:#eee;font-family:'Noto Serif KR',serif;overflow:hidden;}



/* ── 전시장 스테이지(iframe 컨테이너) ── */
#stage-wrap{position:fixed; inset:0; background:#000;}
#stage-wrap iframe{
    position:absolute; inset:0; width:100%; height:100%; border:0; background:#000;
    display:none;
}
#stage-wrap iframe.active{display:block;}

/* ── 존 전환 버튼(언제든 표시) ── */
#zone-nav{
    position:fixed; top:calc(14px + env(safe-area-inset-top));
    right:calc(14px + env(safe-area-inset-right));
    z-index:60; display:flex; gap:8px; background:rgba(0,0,0,.72);
    border:1px solid var(--gold-dim); border-radius:30px; padding:6px; backdrop-filter:blur(8px);
}
#zone-nav button{
    background:transparent; border:none; color:var(--gold-light); font-family:'Noto Serif KR',serif;
    font-size:.8rem; letter-spacing:.04em; padding:9px 16px; border-radius:24px; cursor:pointer;
    min-height:40px; white-space:nowrap;
}
#zone-nav button:hover{background:rgba(212,175,55,.12);}
#zone-nav button.on{background:var(--gold); color:#000; font-weight:700;}
#zone-nav button:focus-visible{outline:3px solid #fff; outline-offset:2px;}

@media(max-width:480px){
    #zone-nav button{font-size:.72rem; padding:8px 12px; min-height:36px;}
}
/* 화면엔 안 보이지만 스크린리더에는 읽히는 알림용 텍스트 — 존(zone)을
   전환할 때 "지금 어느 화면인지"를 TalkBack/VoiceOver 사용자에게도
   알려주기 위한 것이다. */
.sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
}
</style>
</head>
<body>

<!-- 존 전환을 스크린리더에도 알려준다. iframe이 바뀌는 것만으로는
     TalkBack이 자동으로 다시 읽어주지 않으므로, 전환 시점에 여기 문구를
     갱신해 알려준다. -->
<div id="zone-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- ── 전시장 스테이지 ── -->
<div id="stage-wrap">
    <iframe id="frame-intro" title="소개" src="intro.html"></iframe>
    <iframe id="frame-room1" title="전시장 1 · 조우" src="room1.html"></iframe>
    <iframe id="frame-room2" title="전시장 2 · 사유 및 체화" src="room2.html"></iframe>
</div>

<!-- ── 언제든 전시장을 오갈 수 있는 버튼(소개/전시장1/전시장2 세 개) ── -->
<nav id="zone-nav" aria-label="전시장 이동">
    <button type="button" id="nav-intro" aria-pressed="true">소개</button>
    <button type="button" id="nav-room1" aria-pressed="false">전시장 1 · 조우</button>
    <button type="button" id="nav-room2" aria-pressed="false" aria-label="전시장 2 · 사유 및 체화">전시장 2 · 사유&amp;체화</button>
</nav>

<script>
/* ══════════════════════════════════════════════════════
   존(zone) 전환 — 소개/전시장1/전시장2 세 개를 모두 같은 방식으로
   다룬다. 소개 화면도 이제 intro.html이라는 독립 문서(iframe)라서,
   room1/room2와 완전히 동일한 enterRoom()/postMessage 패턴을 쓴다.
   ══════════════════════════════════════════════════════ */
const ZONES = ['intro', 'room1', 'room2'];
const navBtns = {
    intro: document.getElementById('nav-intro'),
    room1: document.getElementById('nav-room1'),
    room2: document.getElementById('nav-room2'),
};
const frames = {
    intro: document.getElementById('frame-intro'),
    room1: document.getElementById('frame-room1'),
    room2: document.getElementById('frame-room2'),
};

// 각 존을 실제로 "시작"했는지(=해당 iframe의 enterRoom()을 이미
// 호출했는지) 기록한다. 처음 들어갈 때만 자동으로 시작시키고, 이후
// 재방문 시에는 하던 자리 그대로 이어가게 둔다(다시 시작시키지 않음).
const entered = { intro:false, room1:false, room2:false };
let currentZone = 'intro';

// 존 전환 시 스크린리더에 읽어줄 안내 문구 — 방문객이 지금 어느
// 화면에 있는지 헷갈리지 않도록 짧게 알려준다("및"을 써서 "&" 기호가
// "앤드"처럼 어색하게 읽히지 않게 했다).
const ZONE_LABELS = {
    intro: '소개',
    room1: '전시장 1, 조우',
    room2: '전시장 2, 사유 및 체화',
};
const zoneStatusEl = document.getElementById('zone-status');

function stopZoneAudio(zone){
    const frame = frames[zone];
    try{
        const win = frame.contentWindow;
        if(!win) return;
        if(win.speechSynthesis) win.speechSynthesis.cancel();
        win.document.querySelectorAll('audio').forEach(a=>{ try{ a.pause(); }catch(e){} });
    }catch(e){ /* 아직 로드 전이거나 접근 불가 — 무시 */ }
}

function tryEnterZone(zone){
    if(entered[zone]) return;
    const frame = frames[zone];
    const win = frame.contentWindow;
    try{
        if(win && typeof win.enterRoom === 'function'){
            win.enterRoom();
            entered[zone] = true;
        }
    }catch(e){ /* 아직 스크립트 로드 전이면 load 핸들러가 다시 시도한다 */ }
}

function switchZone(zone){
    if(zone === currentZone) return;
    const prev = currentZone;
    stopZoneAudio(prev);
    ZONES.forEach(z=>{
        const active = z === zone;
        frames[z].classList.toggle('active', active);
        navBtns[z].classList.toggle('on', active);
        navBtns[z].setAttribute('aria-pressed', active ? 'true' : 'false');
        // display:none만으로도 최신 브라우저에서는 스크린리더 탐색에서
        // 제외되지만, 구형 모바일 웹뷰까지 고려해 inert/aria-hidden도
        // 명시적으로 같이 걸어 비활성 존의 내용이 절대 섞여 들리지
        // 않도록 한다.
        if(active){ frames[z].removeAttribute('inert'); frames[z].removeAttribute('aria-hidden'); }
        else{ frames[z].setAttribute('inert', ''); frames[z].setAttribute('aria-hidden', 'true'); }
    });
    currentZone = zone;
    if(zoneStatusEl) zoneStatusEl.textContent = `${ZONE_LABELS[zone]} 화면으로 이동했습니다.`;
    // 방금 존 전환 버튼을 눌렀던 초점이 이제는 화면에서 사라진 그
    // 자리에 그대로 남지 않도록, 새로 활성화된 iframe으로 초점을
    // 직접 옮긴다 — 키보드·스크린리더 사용자가 매번 처음부터 다시
    // 탐색하지 않고 곧장 그 존의 내용부터 이어서 들을 수 있다.
    try{ frames[zone].focus(); }catch(e){}
    tryEnterZone(zone);
}

// 처음 페이지가 열렸을 때는 소개(intro) 존을 보여주되, 이 시점은
// 실제 사용자 클릭이 아니라 자동 로드이므로 enterRoom()을 호출하지
// 않는다(억지로 "제스처가 있었다"고 처리해버리면 intro.html의 음성
// 낭독 안전장치가 무력화된다). intro.html 자신의 첫 터치/클릭/키
// 입력 감지 로직이 실제 상호작용 시점에 알아서 낭독을 시작한다.
frames.intro.classList.add('active');
navBtns.intro.classList.add('on');
navBtns.intro.setAttribute('aria-pressed', 'true');
// 처음부터 비활성 상태인 room1/room2도 같은 이유로 스크린리더 탐색
// 에서 제외해둔다(switchZone과 동일한 defense-in-depth).
frames.room1.setAttribute('inert', ''); frames.room1.setAttribute('aria-hidden', 'true');
frames.room2.setAttribute('inert', ''); frames.room2.setAttribute('aria-hidden', 'true');

// iframe 로드가 셸의 enterRoom() 호출보다 늦을 수 있으므로, 로드
// 완료 시점에도 한 번 더 시도한다(이미 들어갔다면 tryEnterZone이
// 아무 것도 하지 않으므로 안전하다). intro는 위 설명대로 자동
// 진입 시에는 tryEnterZone을 부르지 않으므로 여기서도 제외한다.
frames.room1.addEventListener('load', ()=>{ if(currentZone === 'room1') tryEnterZone('room1'); });
frames.room2.addEventListener('load', ()=>{ if(currentZone === 'room2') tryEnterZone('room2'); });

navBtns.intro.addEventListener('click', ()=> switchZone('intro'));
navBtns.room1.addEventListener('click', ()=> switchZone('room1'));
navBtns.room2.addEventListener('click', ()=> switchZone('room2'));

// intro.html의 "입장하기"가 눌리면(진짜 사용자 클릭이므로 이때
// switchZone → enterRoom으로 전시장 1의 낭독을 바로 시작해도 안전
// 하다) 전시장 1로 넘어간다. 전시장 1의 내레이션이 끝나면(원래는
// 처음부터 반복하던 지점) room1.html이 보내는 신호로 자동으로
// 전시장 2로 넘어간다.
window.addEventListener('message', (e)=>{
    if(!e || !e.data) return;
    if(e.data.type === 'silence-resonance:intro-complete'){
        switchZone('room1');
    } else if(e.data.type === 'silence-resonance:room1-complete'){
        switchZone('room2');
    }
});
</script>
</body>
</html>
