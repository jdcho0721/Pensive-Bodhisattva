            text: `
                <h3>전시 개요</h3>
                <p>본 전시는 서양의 '실존적 고뇌'를 형상화한 로댕의 <b>생각하는 사람</b>과, 동양의 '자비로운 사유'를 품은 <b>금동미륵보살반가사유상</b>의 영혼의 대화를 다룹니다. 동서양 철학의 두 정점이 마주하며 빚어내는 소리와 형태의 공명을 깊이 감상해보세요.</p>

                <h3>작가 소개</h3>
                <p>본 작품을 제작한 <b>조준동 교수(趙浚東)</b>는 기술에 인간의 감성과 철학적 깊이를 녹여내는 <b>휴마톨로지(Humartology)</b>를 연구·실천하고 있습니다. 성균관대학교 전자전기공학부 명예교수이자 국가인권위원회 위원으로서, 시각장애인 접근성을 위한 다감각 인터페이스와 인터랙티브 아트를 개척해 왔습니다.</p>

                <h3>전시 철학 (Humartology)</h3>
                <p>인간(Human)·예술(Art)·기술(Technology)의 유기적 융합을 뜻하는 휴마톨로지 철학을 바탕으로, 장애와 비장애의 경계를 허물고 모두가 평등하게 천년의 사유에 접속할 수 있는 <b>접근성의 미학</b>을 구현합니다.</p>
                
                <p>예술을 눈으로만 보는 것을 넘어, 감상자의 신체를 직접 인터페이스 삼아 그 시대의 정신과 완벽하게 접속하는 '체화된 인지'의 경지를 지향합니다.</p>

                <h3> 접근성 안내</h3>
                <p>본 작품은 <b>WCAG 2.1 AA</b> 기준을 지향하며, TalkBack(Android) 및 VoiceOver(iOS) 스크린리더, 키보드 단독 조작, 터치 스와이프 내비게이션을 지원합니다. 모든 조각상 영역에 대체 텍스트(aria-label)가 제공되며, 화면 해설(자막)이 실시간으로 음성 안내됩니다.</p>

                <hr style="border-color:rgba(212,175,55,0.3); margin:20px 0;">
                <div style="font-size:0.85rem; color:#888; line-height:1.8;">
                    <strong style="color:#aaa;">반가사유: 사유의 소리 (Contemplation: The Sound of Thought)</strong><br>
                    © 2026 조준동 (趙浚東, Prof. Jun-Dong Cho). All rights reserved.<br>
                    본 작품은 <strong style="color:#aaa;">휴마톨로지(Humartology)</strong> 철학 기반 인터랙티브 미디어아트입니다.<br>

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playEarcon(speaker) {
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const panner = audioCtx.createStereoPanner();

        if (speaker === 'rodin') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
            panner.pan.value = -0.8;
            gain.gain.setValueAtTime(0.8, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        } else {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(1200, now);
            panner.pan.value = 0.8;
            gain.gain.setValueAtTime(0.3, now);
            osc.frequency.linearRampToValueAtTime(1210, now + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 1.2);
        }

        osc.connect(gain).connect(panner).connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 20);
    }

    function speak(text, callback = null) {
        window.speechSynthesis.cancel();
        skipTriggered = false;
        isCoreExplaining = true;
        
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ko-KR';
        u.onend = () => {
            isCoreExplaining = false;
            if (!skipTriggered && callback) {
                callback();
            }
        };
        u.onerror = () => {
            isCoreExplaining = false;
        };
        window.speechSynthesis.speak(u);
    }

    function speakSpatial(text, speaker, onEnd) {
        initAudio();
        window.speechSynthesis.cancel();
        playEarcon(speaker);
        skipTriggered = false;

        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ko-KR';
        u.pitch = (speaker === 'rodin') ? 0.7 : 1.2;
        u.onend = () => {
            if (!skipTriggered && onEnd) {
                onEnd();
            }
        };
        setTimeout(() => {
            window.speechSynthesis.speak(u);
        }, 300);
    }

            currentAudioFile.pause();

        hideAllPopups();

    function handleHotspotInteraction(key) {
        if (currentMode !== 1) return;
        initAudio();

        if (currentActiveKey !== key) {
            stopAllPlayback();
            currentActiveKey = key;
            explanationStep = 1; 
        }

        const data = stage1Data[key];
        if (!data) return;

        if (explanationStep === 1) {
            hideAllPopups();
            if (data.draw) data.draw();
            
            subBox.style.display = 'block';
            subBox.innerHTML = `<b>[철학적 사유]</b><br>${data.philosophy}`;
            
            speak(data.philosophy, () => {
                explanationStep = 2;
            });
            explanationStep = 2;

        } else if (explanationStep === 2) {
            if (data.draw) data.draw();
            
            subBox.style.display = 'block';
            subBox.innerHTML = `<b>[시적 사유]</b><br>${data.poetry}`;
            
            speak(data.poetry, () => {
                explanationStep = 3;
            });
            explanationStep = 3;

        } else if (explanationStep === 3) {
            stopAllPlayback();
            
            if (key.includes('rodin')) {
                document.getElementById('image-popup').style.display = 'flex';
            } else if (key.includes('maitreya')) {
                document.getElementById('maitreya-image-popup').style.display = 'flex';
            }

            subBox.style.display = 'block';
            subBox.innerHTML = `<b>[깊은 사운드스케이프 재생]</b><br>공(공)과 사유의 파동이 온몸의 감각으로 공명합니다.`;

            if (data.sound) {
                data.sound();
            } else {
                playEarcon(key.includes('rodin') ? 'rodin' : 'maitreya');
            }

            currentActiveKey = null;
            explanationStep = 0;
        }
    }

// 이벤트 중복 실행 방지를 위한 플래그 변수
let isProcessing = false;

document.querySelectorAll('.hotspot').forEach(el => {
    // 1. 공통 처리 함수를 분리
    const handleEvent = (e) => {
        // 이미 처리 중이면 무시 (0.5초 동안 중복 실행 차단)
        if (isProcessing) return;
        
        isProcessing = true;
        
        // 터치 시 진동 피드백
        if (e.type === 'touchstart' && navigator.vibrate) {
            navigator.vibrate(50);
        }

        processHotspotAction(el, e);

        // 0.5초 후 다시 처리 가능하도록 잠금 해제
        setTimeout(() => { isProcessing = false; }, 500);
    };

    // click과 touchstart 모두 동일한 핸들러 연결
    el.addEventListener('click', handleEvent);
    el.addEventListener('touchstart', handleEvent, { passive: false });
});

// processHotspotAction: 4단계(체화)에서는 hotspot 클릭·터치를 완전히 무시
function processHotspotAction(el, e) {
    e.preventDefault();
    e.stopPropagation();

    // 4단계 진행 중: 해설·게이지를 보호하기 위해 모든 hotspot 상호작용 무시
    if (currentMode === 4) return;

    const ariaLabel = el.getAttribute('aria-label');
    if (ariaLabel) speakButtonIn(ariaLabel);

    const id = el.id.replace('-', '_');
    
    if (currentMode === 2 || currentMode === 3) {
        const speakerKey = el.id.includes('rodin') ? 'rodin' : 'maitreya';
        handleHotspotClick(speakerKey);
    } else {
        handleHotspotInteraction(id);
    }
}

    async function fetchAITalk(prompt) {
        try {
            const response = await fetch("http://localhost:1234/v1/chat/completions", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "meta-llama-3.1-8b-instruct",
                    messages: [
                        { role: "system", content: "당신은 깊은 성찰을 지닌 철학적 조각상의 영혼입니다. 고풍스럽고 정제된 품격 있는 한국어 문장으로 답변하세요." },
                        { role: "user", content: prompt }
                    ],
                    temperature: 0.7, max_tokens: 150
                })
            });
            const data = await response.json();
            return data.choices[0].message.content;
        } catch (error) {
            console.error("AI 서버 통신 오류:", error);
            return "깊은 침묵만이 흐르고 있습니다. (내부 인공지능 서버의 상태를 확인하여 주십시오.)";
        }
    }

    function drawCircle(cxPct, cyPct, rPx, color) {
        const w = container.clientWidth;
        const h = container.clientHeight;
        const cx = w * (cxPct / 100);
        const cy = h * (cyPct / 100);

        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', cx);
        circle.setAttribute('cy', cy);
        circle.setAttribute('r', rPx);
        circle.setAttribute('stroke', color);
        circle.setAttribute('stroke-width', '3');
        circle.setAttribute('fill', 'none');
        circle.style.transition = 'all 1.5s ease-out';
        svg.appendChild(circle);

        setTimeout(() => {
            circle.setAttribute('r', rPx * 2.5);
            circle.style.opacity = '0';
        }, 50);
        setTimeout(() => circle.remove(), 1600);
    }

    function drawPolygon(pointsPct, color) {
        const w = container.clientWidth;
        const h = container.clientHeight;
        
        const absolutePoints = pointsPct.split(' ').map(p => {
            const xy = p.split(',');
            const x = w * (parseFloat(xy[0]) / 100);
            const y = h * (parseFloat(xy[1]) / 100);
            return `${x},${y}`;
        }).join(' ');

        const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        poly.setAttribute('points', absolutePoints);
        poly.setAttribute('stroke', color);
        poly.setAttribute('stroke-width', '3');
        poly.setAttribute('fill', 'none');
        poly.style.transition = 'all 1.5s ease-out';
        poly.style.transformOrigin = 'center';
        svg.appendChild(poly);

        setTimeout(() => {
            poly.style.transform = 'scale(1.8)';
            poly.style.opacity = '0';
        }, 50);
        setTimeout(() => poly.remove(), 1600);
    }

    async function handleHotspotClick(speakerKey) {
        if (currentMode !== 2 && currentMode !== 3) return;
        if (currentMode === 2 && currentStage2Mode === 'script') return;
        if (currentMode === 3 && !avatarModeActive) return;

        const isRodin = speakerKey === 'rodin';
        const role = isRodin ? "생각하는 사람" : "반가사유상";
        const color = isRodin ? "#ff4500" : "gold";

        svg.innerHTML = ''; 
        if (isRodin) drawCircle(30, 30, 55, "#ff4500");
        else drawCircle(75, 30, 55, "gold");

        const basePersona = isRodin 
            ? "당신은 로댕의 '생각하는 사람'입니다. 나는 묻는다. 그저 존재한다는 무거운 짐에 짓눌려 신음할 것인가, 이 실존의 무게를 끝까지 견뎌내며 본질을 발견할 것인가. 우리는 이 고뇌를 피할 수 없으니, 내면을 찢어서라도 이 부딪치는 심장 소리를 세상에 들려주어야 한다. 실존적 고뇌와 인생의 무게감을 담아 장중한 한국어 한 문장으로 말하세요."
            : "당신은 '반가사유상'입니다. 세상의 모든 것이 변해가고 손이 닿지 않는 저 먼 곳에서 상처가 자라납니다. 당신의 그 뼈아픈 고통을 온전히 품어 안는 것, 그것이 나의 자비입니다. 원망을 비워내고 스스로 삶을 바꿀 수 있는 것은 결국 당신의 선택입니다. 비움, 미래의 구원과 초월적인 희망의 미소, 그리고 자비의 도리를 담아 온화한 한국어 한 문장으로 답하세요.";

        let finalPrompt = "";
        if (currentStage2Mode === 'ai_personal' && avatarModeActive) {
            const conversationHistory = dialogueSessionData.slice(-3).map(d => `${d.name}: ${d.text}`).join('\n');
            finalPrompt = `[감상자의 고민]: "${userPersona}"\n[최근 대화 흐름]:\n${conversationHistory}\n\n당신은 ${role}입니다. 감상자의 고민에 대해 이미 했던 상투적인 표현이나 방금 전의 답변 문장을 완전히 피하고, 당신만의 철학적 페르소나를 담아 새로운 관점의 깊은 위로와 통찰을 담은 한국어 한 문장을 작성하세요.`;
        } else {
            finalPrompt = `[맥락]: 조각상 간의 상호 공명 대화 중입니다. 앞선 흐름을 이어받아 ${role}의 페르소나(${basePersona})에 어울리는 한 문장 사유를 이어가세요.`;
        }

        showSubtitle(`<b>${role} 사유 중...</b>`, color);
        const aiResponse = await fetchAITalk(finalPrompt);
        
        dialogueSessionData.push({ name: role, text: aiResponse });
        
        const nextChainAction = () => {
            if (currentMode !== 2) return; // 4단계 등으로 전환 시 대화 체인 즉시 중단
            if (currentStage2Mode === 'ai_sim' && aiDialogueCount < 3) {
                aiDialogueCount++;
                setTimeout(() => handleHotspotClick(isRodin ? 'maitreya' : 'rodin'), 1000);
            } else if (currentStage2Mode === 'ai_sim' && aiDialogueCount >= 3) {
                finishStage2();
            }
        };

        if (currentMode !== 2) return; // AI 응답 대기 중 모드 전환된 경우 출력 없이 종료
        showSubtitle(`<b>${role}</b><br>${aiResponse}`, color, nextChainAction);
        
        speakSpatial(aiResponse, isRodin ? 'rodin' : 'maitreya', () => {
            nextChainAction();
        });
    }

    function runFixedDialogueLoop() {
        if (currentMode !== 2) return; // 모드 전환 시 고정 대본 루프 즉시 중단
        if (dialogueIndex < fixedScript.length) {
            const line = fixedScript[dialogueIndex];
            dialogueSessionData.push({ name: line.name, text: line.text });

            svg.innerHTML = '';
            if (line.speaker === 'rodin') drawCircle(30, 30, 55, "#ff4500");
            else drawCircle(75, 30, 55, "gold");

            const nextStep = () => {
                if (currentMode !== 2) return; // 콜백 실행 시점에도 모드 재확인
                dialogueIndex++;
                setTimeout(runFixedDialogueLoop, 800);
            };

            showSubtitle(`<b>${line.name}</b><br>${line.text}`, line.color, nextStep);
            
            speakSpatial(line.text, line.speaker, () => {
                nextStep();
            });
        } else {
            finishStage2();
        }
    }

    function handleChat() {
        const inputField = document.getElementById('chat-input');
        const msgContainer = document.getElementById('chat-messages');
        const userMsg = inputField.value.trim();
        
        if (!userMsg) return;

        msgContainer.innerHTML += `<div style="text-align: right; margin-bottom: 5px; color: #fff;">나: ${userMsg}</div>`;
        inputField.value = '';
        msgContainer.scrollTop = msgContainer.scrollHeight;
        
        let reply = "그 사유의 길은 조금 더 깊이 있게 들어가 봐야겠네요. 다른 카테고리를 선택해 보시겠어요?";
        
        for (let key in chatKnowledgeBase) {
            if (userMsg.includes(key) || key.includes(userMsg)) {
                reply = chatKnowledgeBase[key];
                break;
            }
        }

        setTimeout(() => {
            msgContainer.innerHTML += `<div style="margin-bottom: 8px; color: gold;">조각상: ${reply}</div>`;
            msgContainer.scrollTop = msgContainer.scrollHeight;
            speak(reply);
        }, 400);
    }

// startStage4Meditation: 게이지 루프를 speak 콜백에서 완전 분리
    // → 어떤 외부 상호작용이 해설을 중단시켜도 게이지는 반드시 동작함
    let _s3Interval = null; // 4단계 게이지 interval 핸들

    function startStage4Meditation() {
        mirrorGuide.style.display = "block";
        const progress = document.getElementById('gauge-progress');
        progress.style.strokeDashoffset = "376.99";

        // 이전 게이지 잔여분 제거
        if (_s3Interval) { clearInterval(_s3Interval); _s3Interval = null; }

        const introText = "4단계 체화 명상 단계입니다. 화면 중앙의 원형 가이드를 바라보며, 조각상의 깊은 명상 자세를 신체로 직접 따라해 보세요. 고뇌를 비워내는 체화의 시간입니다.";
        subBox.innerHTML = `<b>[4단계: 체화 명상]</b><br>${introText}`;

        speak(introText);

        // 게이지는 고정 딜레이(8초) 후 독립 실행
        setTimeout(() => {
            if (currentMode !== 4) return;
            let count = 0;
            _s3Interval = setInterval(() => {
                if (currentMode !== 4) {
                    clearInterval(_s3Interval); _s3Interval = null; return;
                }
                count += 1;
                const offset = 376.99 - (376.99 * (count / 100));
                progress.style.strokeDashoffset = offset;
                subBox.innerHTML = `<b>[4단계: 체화 명상 진행 중]</b><br>신체 동조율 심화 중... (${count}%)`;

        if (count >= 100) {
                    clearInterval(_s3Interval); _s3Interval = null;
                    document.getElementById('mirror-text').innerText = "체화 명상 완료";
                    const completeText = "신체 동조와 명상이 완벽하게 완료되었습니다. 당신의 육체가 조각상의 사유와 하나로 접속되었습니다.";
                    subBox.innerHTML = `<b>[4단계: 체화 명상 완료]</b><br>${completeText}`;
                    speak(completeText);

                    // 여일 버튼 생성
                    const yeoilBtn = document.createElement('button');
                    yeoilBtn.innerText = "여일";
                    yeoilBtn.className = "confirm-btn";
                    yeoilBtn.onclick = () => {
                        mirrorGuide.style.display = "none";
                        yeoilBtn.remove();
                        subBox.style.display = "none";
                        window.speechSynthesis.cancel();
                        startStageFinal();
                    };
                    mirrorGuide.appendChild(yeoilBtn);
                }
            }, 150);
        }, 8000);
    }

   
    function startStageFinal() {
        initAudio();
        stopAllPlayback();
        currentStage2Mode = ''; // 2단계 대화 체인 완전 차단
        aiDialogueCount = 0;
        if (mirrorGuide) mirrorGuide.style.display = 'none';
        document.querySelectorAll('.hotspot').forEach(el => el.style.display = 'none');
        document.getElementById('chatbot-container').style.display = 'none';

        currentMode = 5;
        mainTitle.innerText = "반가사유: 사유의 소리 (5단계: 여일)";
        modeBtn.innerText = "초기화면으로 돌아가기";
        modeBtn.disabled = false;
        modeBtn.onclick = () => restartToStage1();

        // 배경 서서히 흐림 (조각상과 내가 하나 되는 합일 연출)
        container.style.transition = "filter 5s ease-in-out";
        container.style.filter = "blur(0px) brightness(1)";

        const introMsg = "여일의 단계입니다. 이제 당신은 조각상과 하나가 됩니다.";
        const coreMsg = "고뇌와 자비가 이제 하나의 울림이 되어 마음의 중심으로 완벽하게 합쳐집니다. 깊은 사유의 향이 정적으로 가라앉는 순간, 당신 안의 광활한 여백과 마주해 보세요.";
        const finalZen = "당신이 곧 우주이자 사유 그 자체입니다.";

        showSubtitle(`<b>여일: 합일의 소리</b><br>${introMsg}`, "white");

        // 합일 사운드 (두 오실레이터가 중앙으로 수렴)
        const now = audioCtx.currentTime;
        [-0.8, 0.8].forEach((startPan, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const panner = audioCtx.createStereoPanner();
            osc.frequency.setValueAtTime(i === 0 ? 110 : 164.81, now);
            panner.pan.setValueAtTime(startPan, now);
            panner.pan.linearRampToValueAtTime(0, now + 15);
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.04, now + 2);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 20);
            osc.connect(gain).connect(panner).connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 20);
        });

        speak(introMsg, () => {
            showSubtitle(`<b>여일</b><br>${coreMsg}`, "white");
            speak(coreMsg, () => {
                playZenEndSequence(finalZen);
            });
        });
    }

    function playZenEndSequence(finalZen) {
        // Sacred_Morning.mp4 재생
        if (currentAudioFile) {
            currentAudioFile.pause();
            currentAudioFile = null;
        }
        const sacredAudio = new Audio('Sacred_Morning.mp4');
        sacredAudio.volume = 0.9;
        sacredAudio.play().catch(e => console.log('Sacred_Morning 재생 오류:', e));
        currentAudioFile = sacredAudio;

        // 화면을 서서히 흐리게 (비움의 상태 시각화)
        container.style.transition = "filter 5s ease-in-out";
        container.style.filter = "blur(12px) brightness(2.5) grayscale(1)";

        showSubtitle(`<b>[물아일체]</b><br>${finalZen}`, "gold");
        speak(finalZen, () => {
            // 음성 끝나면 비움 화면으로 전환
            _zenTimeouts.push(setTimeout(() => triggerAbsoluteSilence(), 3000));
        });

        // 최대 15초 후 강제 전환 (안전장치)
        _zenTimeouts.push(setTimeout(() => triggerAbsoluteSilence(), 15000));
    }

    let _silenceTriggered = false;
    let _zenTimeouts = [];
    function triggerAbsoluteSilence() {
        if (_silenceTriggered) return;
        _silenceTriggered = true;

        // ── 핵심 수정: subBox click을 완전 무력화하여 skipAndNext() 재진입 차단 ──
        subBox.onclick = function(e) { if (e) e.stopPropagation(); };

        // 완전한 흰 비움 화면 (total-silence)
        container.style.transition = "filter 3s ease-in-out, background 3s ease-in-out";
        container.style.filter = "none";
        container.style.background = "white";
        container.classList.add('total-silence');

        const emptyZen = "비어있기에 당신은 무엇이든 담을 수 있습니다.";
        mainTitle.innerText = "";

        // inline onclick 제거 → JS로 버튼 생성하여 이벤트 버블링 완전 차단
        subBox.innerHTML = `
            <div id="zen-final-div" style="text-align:center;">
                <b style="font-size:1.6rem; letter-spacing:0.2em;">無</b><br><br>
                ${emptyZen}<br><br>
            </div>
        `;
        const restartBtn = document.createElement('button');
        restartBtn.textContent = '처음(1단계: 조우)으로 돌아가기';
        restartBtn.style.cssText = 'padding:14px 32px;background:gold;color:black;border:2px solid white;border-radius:25px;font-size:1.1rem;font-weight:bold;cursor:pointer;box-shadow:0 0 18px rgba(255,215,0,0.6);margin-top:10px;';
        restartBtn.addEventListener('click', function(e) {
            e.stopPropagation();  // subBox로 버블링 방지
            restartToStage1();
        });
        document.getElementById('zen-final-div').appendChild(restartBtn);

        subBox.style.display = 'block';
        subBox.style.borderColor = 'gold';
        modeBtn.style.display = 'none';
    }

    function restartToStage1() {
        // 상태 완전 초기화
        _silenceTriggered = false;
        // zen 타임아웃 모두 취소 (재진입 방지)
        _zenTimeouts.forEach(t => clearTimeout(t));
        _zenTimeouts = [];
        currentStage2Mode = '';
        avatarModeActive = false;
        if (currentAudioFile) { currentAudioFile.pause(); currentAudioFile = null; }
        window.speechSynthesis.cancel();
        if (typeof _s3Interval !== 'undefined' && _s3Interval) { clearInterval(_s3Interval); _s3Interval = null; }

        // 5단계 화면 완전 초기화
        container.className = "";
        container.removeAttribute('style');

        subBox.style.display = 'none';
        subBox.innerHTML = '';
        subBox.style.borderColor = '';
        subBox.style.cursor = '';

        mainTitle.innerText = "";

        document.querySelectorAll('.hotspot').forEach(el => el.style.display = '');
        mirrorGuide.style.display = 'none';
        svg.innerHTML = '';
        document.getElementById('stage3-scenario-group').style.display = 'none';

        // 기존 여일 버튼이 남아 있으면 제거
        mirrorGuide.querySelectorAll('.confirm-btn').forEach(b => b.remove());

        modeBtn.disabled = false;
        modeBtn.style.display = '';
        modeBtn.onclick = toggleMode;
        subBox.onclick = function(e) { if(e) e.stopPropagation(); skipAndNext(); };

        setMode(1);
    }

let touchStartX = 0;

function setupSwipeToClose() {
    // subBox에 터치 이벤트 리스너 추가
    subBox.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    subBox.addEventListener('touchend', (e) => {
        let touchEndX = e.changedTouches[0].screenX;
        let deltaX = touchEndX - touchStartX;

        // 왼쪽에서 오른쪽으로 100px 이상 스와이프 시 닫기
        if (deltaX > 100) {
            closeCurrentStage();
        }
    }, { passive: true });
}

function closeCurrentStage() {
    // subBox를 비우고 상태를 초기 상태로 되돌림
    subBox.style.display = 'none';
    subBox.innerHTML = '';
    // 모드 버튼이 있었다면 다시 보여줌
    if(typeof modeBtn !== 'undefined') {
        modeBtn.style.display = '';
    }
    console.log("창이 스와이프를 통해 닫혔습니다.");
}


</script>
</body>
</html>
